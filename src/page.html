<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mock-ollama</title>
<script src="https://unpkg.com/gpt-tokenizer/dist/cl100k_base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "Helvetica Neue", sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
  min-height: 100vh;
}

/* 顶部栏 */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 24px;
  background: #1a1a1a;
  border-bottom: 1px solid #2a2a2a;
  overflow: visible;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
}

.logo-container {
  position: relative;
  display: inline-block;
}

.logo {
  font-size: 24px;
  font-weight: 700;
  color: #e5e7eb;
  letter-spacing: -0.5px;
  position: relative;
  display: inline-block;
  padding: 4px 12px;
  transition: color 2s ease-out, text-shadow 2s ease-out;
  text-shadow:
    1px 1px 0 #333,
    2px 2px 0 #2a2a2a,
    3px 3px 0 #1a1a1a;
}

/* Logo 点亮效果 */
.logo.illuminated {
  color: #ffffff;
  text-shadow:
    0 0 10px rgba(255,255,255,0.8),
    0 0 20px rgba(255,255,255,0.5),
    0 0 40px rgba(255,255,255,0.3),
    1px 1px 0 #333,
    2px 2px 0 #2a2a2a,
    3px 3px 0 #1a1a1a;
  transition: color 0.05s ease-out, text-shadow 0.05s ease-out;
}

/* SVG 闪电容器 */
.lightning-svg {
  position: absolute;
  top: 50%;
  left: calc(50% - 40px);
  transform: translate(-50%, -60%) rotate(10deg);
  width: 120%;
  height: 200%;
  pointer-events: none;
  z-index: 10;
}

/* 主闪电路径 */
.lightning-main {
  fill: none;
  stroke: url(#lightningGradient);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
}

/* 闪电分叉 */
.lightning-branch {
  fill: none;
  stroke: url(#branchGradient);
  stroke-width: 2;
  stroke-linecap: round;
  opacity: 0;
}

/* 闪电动画序列 */
@keyframes strikeSequence {
  0%, 100% { opacity: 0; }
  /* 第一次微闪 ~700ms */
  14% { opacity: 0.6; }
  15% { opacity: 0; }
  /* 第二次主闪 ~850ms */
  17% { opacity: 1; }
  19% { opacity: 0.9; }
  21% { opacity: 1; }
  /* 渐暗 */
  26% { opacity: 0.4; }
  /* 熄灭 */
  32%, 100% { opacity: 0; }
}

.lightning-main.active,
.lightning-branch.active {
  animation: strikeSequence 5s ease-out infinite;
}

/* 字体电流效果 - SVG text 描边 */
.logo-current-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 20;
  overflow: visible;
}

.logo-current-text {
  fill: transparent;
  stroke: #ffffff;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
  stroke-dasharray: 4 16;
  stroke-dashoffset: 0;
  opacity: 0;
  filter: drop-shadow(0 0 3px rgba(255,255,255,0.9));
}

.logo-current-text.active {
  opacity: 1;
  animation: flowTextCurrent 0.55s linear forwards;
}

@keyframes flowTextCurrent {
  0% {
    stroke-dashoffset: 0;
    opacity: 1;
  }
  70% {
    opacity: 0.8;
  }
  100% {
    stroke-dashoffset: -80;
    opacity: 0;
  }
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: #2a2a2a;
  border-radius: 8px;
  font-size: 13px;
  color: #888;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #059669;
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.header-controls {
  display: flex;
  gap: 8px;
}

.btn {
  padding: 8px 16px;
  border: 1px solid #333;
  border-radius: 8px;
  background: transparent;
  color: #888;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.btn:hover { border-color: #555; color: #fff; }

.token-dashboard {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: none;
  padding: 32px;
  overflow-y: auto;
  background: rgba(0, 0, 0, 0.76);
  backdrop-filter: blur(5px);
}
.token-dashboard.open { display: block; }
.token-dashboard-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px;
  border: 1px solid #343434;
  border-radius: 16px;
  background: #151515;
  box-shadow: 0 24px 80px rgba(0,0,0,0.55);
}
.token-dashboard-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.token-dashboard-close { display:grid; flex:0 0 auto; align-self:flex-start; padding:0; place-items:center; }
.token-dashboard-close svg { width:16px; height:16px; stroke:#888; stroke-linecap:round; stroke-width:2; }
.token-dashboard-close:hover svg { stroke:#ddd; }
.token-dashboard-title { font-size:20px; font-weight:700; color:#f3f4f6; }
.token-dashboard-subtitle { margin-top:5px; color:#777; font-size:12px; }
.token-overview-grid { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:12px; margin-bottom:24px; }
.token-stat-card, .token-chart-card {
  border:1px solid #2d2d2d;
  border-radius:12px;
  background:#1b1b1b;
}
.token-stat-card { min-height:102px; padding:16px; }
.token-stat-label { color:#888; font-size:12px; line-height:1.35; }
.token-stat-value { margin-top:10px; color:#f3f4f6; font-size:22px; font-weight:650; letter-spacing:-.4px; }
.token-chart-grid { display:grid; grid-template-columns:minmax(0, 1.5fr) minmax(280px, .8fr); gap:16px; }
.token-chart-card { min-height:320px; padding:16px; }
.token-chart-card.wide { grid-column:1 / -1; min-height:410px; }
.token-chart-card.request-chart-card { min-width:0; }
.token-chart-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.token-chart-title { color:#ddd; font-size:14px; font-weight:600; }
.token-chart-total { margin-left:6px; color:#9ca3af; font-size:18px; font-weight:500; }
.token-chart-range { margin-top:4px; color:#777; font-size:11px; font-weight:400; }
.token-chart { position:relative; height:250px; }
.token-chart.wide-chart { height:330px; }
.token-chart-error { display:grid; height:100%; place-items:center; padding:24px; color:#fca5a5; font-size:12px; text-align:center; }
.token-switch { display:flex; gap:6px; }
.token-switch button { min-height:32px; padding:4px 10px; border:1px solid #333; border-radius:8px; background:#1b1b1b; color:#888; font-size:12px; cursor:pointer; transition:border-color .2s, background .2s, color .2s; }
.token-switch button:hover { border-color:#555; color:#ddd; }
.token-switch button:focus-visible { border-color:#777; color:#fff; outline:1px solid #888; outline-offset:2px; }
.token-switch button.active { color:#f3f4f6; border-color:#777; background:#222; box-shadow:inset 0 -1px 0 #bbb; }
.token-dashboard-loading { padding:56px; color:#888; text-align:center; }
body.token-dashboard-open { overflow:hidden; }
.token-request-section { margin-top:16px; padding:16px; border:1px solid #2d2d2d; border-radius:12px; background:#1b1b1b; }
.token-request-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
.token-request-meta { color:#777; font-size:12px; }
.token-request-table { overflow-x:auto; }
.token-request-head, .token-request-row { display:grid; grid-template-columns:190px minmax(220px, 1.35fr) 110px 110px 110px 110px; column-gap:18px; align-items:center; min-width:860px; }
.token-request-head { padding:0 14px 10px; color:#777; font-size:12px; }
.token-request-list { display:grid; gap:6px; }
.token-request-row { min-height:68px; padding:11px 14px; border:1px solid #303030; border-radius:9px; background:#202020; }
.token-request-row:hover { border-color:#3b3b3b; background:#252525; }
.token-request-time, .token-request-model, .token-request-number { min-width:0; }
.token-request-time { color:#c4c4c4; font-size:13px; white-space:nowrap; }
.token-request-model strong { display:block; overflow:hidden; color:#e5e7eb; font-size:13px; font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
.token-request-model span { display:block; overflow:hidden; margin-top:5px; color:#777; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
.token-request-number { color:#d1d5db; font:13px 'SF Mono', monospace; text-align:right; }
.token-request-number.total { color:#f3f4f6; font-weight:650; }
.token-request-empty { padding:28px; color:#777; text-align:center; }
.token-pagination { display:flex; justify-content:flex-end; align-items:center; gap:4px; margin-top:12px; color:#777; font-size:12px; }
.token-pagination button:disabled { opacity:.35; cursor:not-allowed; }
.token-page-button { position:relative; min-width:28px; height:28px; padding:0 6px; border:0; background:transparent; color:#888; font:inherit; cursor:pointer; }
.token-page-button:hover { color:#fff; }
.token-page-button:focus-visible { color:#fff; outline:1px solid #f3f4f6; outline-offset:1px; }
.token-page-button.active { color:#fff; font-weight:650; }
.token-page-button.active::after { position:absolute; bottom:1px; left:50%; width:10px; height:2px; border-radius:999px; background:#fff; content:''; transform:translateX(-50%); }
.token-page-nav { padding:4px 9px; }
@media (max-width: 860px) {
  .token-dashboard { padding:12px; }
  .token-dashboard-inner { padding:16px; }
  .token-overview-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .token-chart-grid { grid-template-columns:1fr; }
  .token-chart-card.wide { grid-column:auto; }
}
@media (max-width: 520px) {
  .token-dashboard-inner { padding:12px; }
  .token-dashboard-header, .token-chart-heading, .token-request-toolbar { align-items:flex-start; flex-wrap:wrap; }
  .token-overview-grid { grid-template-columns:1fr; }
  .token-chart-card { padding:12px; }
  .token-chart.wide-chart { height:290px; }
}
@media (prefers-reduced-motion: reduce) {
  .token-dashboard *, .token-dashboard *::before, .token-dashboard *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* SVG 内嵌实现精确的旋转边框动画 */
.btn.active-snake {
  position: relative;
  border: 1px solid #3a3a3a;
  background: #1a1a1a;
  color: #fff;
  overflow: visible;
}
.snake-border-svg {
  position: absolute;
  inset: -2px;
  width: calc(100% + 4px);
  height: calc(100% + 4px);
  pointer-events: none;
  filter: drop-shadow(0 0 3px rgba(255,255,255,0.9))
          drop-shadow(0 0 6px rgba(255,255,255,0.5))
          drop-shadow(0 0 12px rgba(255,255,255,0.3));
}
.snake-border-svg path {
  fill: none;
  stroke: rgba(255,255,255,0.95);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 40 145 40 145;
  animation: snake-run 4s linear infinite;
}
@keyframes snake-run { to { stroke-dashoffset: -370; } }

/* 主内容区 */
.main {
  padding: 24px;
  max-width: 1200px;
  margin: 0 auto;
}

.section-label {
  font-size: 13px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

/* 日志卡片 */
.log-card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s;
  content-visibility: auto;
  contain: layout paint style;
  contain-intrinsic-size: auto 112px;
}

.log-card:hover { border-color: #3a3a3a; }
.log-card.expanded { border-color: #059669; }

.log-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 16px;
  line-height: 1;
}

.log-time {
  font-size: 12px;
  color: #666;
  font-family: 'SF Mono', monospace;
  white-space: nowrap;
  line-height: 1;
}
.log-time-date { color: #666; }
.log-time-clock { color: #666; transition: color 0.3s ease; }
.log-card:hover .log-time-clock { color: #e0e0e0; }

.log-method {
  font-size: 13px;
  font-weight: 600;
  color: #059669;
  width: 50px;
  line-height: 1;
  margin-left: 8px;
  text-align: center;
}

.log-method.POST { color: #2563eb; }

.log-path {
  font-size: 13px;
  color: #e0e0e0;
  font-family: 'SF Mono', monospace;
  line-height: 1;
}

.log-session {
  font-size: 11px;
  color: #a78bfa;
  font-family: 'SF Mono', monospace;
  line-height: 1;
  word-break: break-all;
}

.log-status {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-family: 'SF Mono', monospace;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  min-height: 18px;
  margin-left: 16px;
}

.log-status.success { background: rgba(5,150,105,0.2); color: #059669; }
.log-status.error { background: rgba(220,38,38,0.2); color: #dc2626; }

.log-expand-btn {
  margin-left: auto;
  padding: 4px 10px;
  border: 1px solid #333;
  border-radius: 6px;
  background: transparent;
  color: #888;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.log-expand-btn:hover {
  border-color: #2563eb;
  color: #2563eb;
}

.log-card.expanded .log-expand-btn {
  background: rgba(37,99,235,0.1);
  border-color: #2563eb;
  color: #2563eb;
}

/* 横向上下文分布条 - 类似 /context */
.dist-bar-wrap {
  padding: 12px 16px;
  background: #0f0f0f;
}

.dist-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.dist-model {
  font-size: 14px;
  color: #888;
}

.dist-total {
  font-size: 14px;
  color: #888;
  font-family: 'SF Mono', monospace;
}

.dist-bar-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dist-bar {
  display: flex;
  height: 24px;
  border-radius: 4px;
  overflow: hidden;
  flex-wrap: nowrap;
}

.dist-seg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  color: #fff;
  min-width: 20px;
  transition: all 0.3s;
}

/* 请求段颜色 */
.seg-user        { background: #2563eb; }
.seg-assistant   { background: #7c3aed; }
.seg-system      { background: #9ca3af; }

/* 响应段颜色 */
.seg-thinking    { background: #7c3aed; }
.seg-text        { background: #059669; }
.seg-free        { background: #333; }
.seg-error       { background: #dc2626; }
.seg-cache       { background: #0891b2; }

/* Cache 样式 */
.dist-cat-cache { background: rgba(8,145,178,0.1); border-radius: 6px; padding: 4px 0; }
.dist-cat-cache-warning { background: rgba(220,38,38,0.15); border-radius: 6px; padding: 4px 0; border: 1px solid rgba(220,38,38,0.3); }
.dist-cat-value.cache { color: #0891b2; }
.dist-cat-value.cache-warning { color: #dc2626; }

/* 分类列表 - 类似 /context */
.dist-categories {
  margin-top: 12px;
}

.dist-category {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 13px;
}

.dist-cat-bar {
  display: flex;
  height: 16px;
  width: 200px;
  border-radius: 3px;
  overflow: hidden;
  background: #1a1a1a;
}

.dist-cat-fill {
  height: 100%;
  border-radius: 3px;
}

.dist-cat-label {
  color: #888;
  min-width: 100px;
}

.dist-cat-value {
  color: #666;
  font-family: 'SF Mono', monospace;
}

.dist-cat-value.highlight { color: #e0e0e0; }
.dist-cat-value.green { color: #059669; }
.dist-cat-value.orange { color: #d97706; }
.dist-cat-value.tool { color: #e89d3a; }
.dist-cat-value.blue { color: #2563eb; }
.dist-cat-value.purple { color: #7c3aed; }

.dist-meta-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  flex-wrap: wrap;
}

.dist-meta-line .dist-cat-label {
  min-width: auto;
}

.dist-meta-line .dist-meta-sep {
  color: #444;
  margin: 0 4px;
}

/* 详情展开区 */
.log-detail {
  display: none;
  padding: 0 16px 16px;
  border-top: 1px solid #2a2a2a;
}

.log-card.expanded .log-detail { display: block; }

/* 视图切换 */
.view-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.view-btn {
  padding: 4px 12px;
  border: 1px solid #333;
  border-radius: 6px;
  background: transparent;
  color: #666;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.view-btn:hover { border-color: #555; color: #888; }
.view-btn.active { border-color: #2563eb; color: #2563eb; background: rgba(37,99,235,0.1); }

.detail-section {
  margin-top: 12px;
}

.detail-label {
  font-size: 11px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.detail-json {
  font-family: 'SF Mono', Consolas, monospace;
  font-size: 12px;
  line-height: 1.5;
  color: #e0e0e0;
  background: #0f0f0f;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #2a2a2a;
  overflow-x: hidden;
  max-height: 300px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* 请求 JSON 更长 */
.detail-json.request-json {
  max-height: 500px;
}

.detail-error {
  padding: 12px;
  background: rgba(220,38,38,0.1);
  border-radius: 8px;
  color: #dc2626;
  font-size: 13px;
}

/* 友好视图 */
.friendly-view {
  font-size: 14px;
  line-height: 1.8;
}

.friendly-section {
  margin-bottom: 16px;
}

.friendly-title {
  font-size: 13px;
  color: #888;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #2a2a2a;
}

.friendly-row {
  display: flex;
  gap: 8px;
  margin-bottom: 6px;
}

.friendly-label {
  color: #666;
  min-width: 80px;
}

.friendly-value {
  color: #e0e0e0;
}

.friendly-value.highlight { color: #059669; }
.friendly-value.orange { color: #d97706; }
.friendly-value.blue { color: #2563eb; }
.friendly-value.purple { color: #7c3aed; }

.message-block {
  background: #0f0f0f;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  border: 1px solid #2a2a2a;
}

.message-role {
  font-size: 11px;
  color: #666;
  margin-bottom: 4px;
}

.message-content {
  font-size: 13px;
  color: #e0e0e0;
  white-space: pre-wrap;
  word-break: break-word;
}

.log-interaction-content {
  width: 100%;
  max-height: 120px;
  overflow: auto;
}

.thinking-block {
  background: rgba(124,58,237,0.1);
  border: 1px solid rgba(124,58,237,0.3);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
}

.thinking-label {
  font-size: 11px;
  color: #7c3aed;
  margin-bottom: 4px;
}

.response-block {
  background: rgba(5,150,105,0.1);
  border: 1px solid rgba(5,150,105,0.3);
  border-radius: 8px;
  padding: 10px 12px;
}

.response-label {
  font-size: 11px;
  color: #059669;
  margin-bottom: 4px;
}

/* Legend */
.legend {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  padding: 12px 16px;
  background: #1a1a1a;
  border-radius: 8px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #888;
}

.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

/* 空状态 */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: #555;
}

.empty-text { font-size: 14px; color: #555; }

/* 日志卡片摘要仅用细滚动条提示内容位置，避免抢占正文空间。 */
.log-interaction-content { scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }
.log-interaction-content::-webkit-scrollbar { width: 4px; height: 4px; }
.log-interaction-content::-webkit-scrollbar-track { background: transparent; }
.log-interaction-content::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 999px; }
.log-interaction-content::-webkit-scrollbar-thumb:hover { background: #555; }

/* 其他可滚动区域保留默认可拖动滚动条。 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #0f0f0f; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

/* 右侧滑出面板 */
.slide-panel {
  position: fixed;
  top: 0;
  right: -600px;
  width: 600px;
  height: 100vh;
  background: #1a1a1a;
  border-left: 1px solid #2a2a2a;
  z-index: 1000;
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
}

.slide-panel.open { right: 0; }
body.panel-open { overflow: hidden; }

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid #2a2a2a;
}

.panel-title {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
}

.panel-close {
  width: 32px;
  height: 32px;
  border: 1px solid #333;
  border-radius: 8px;
  background: transparent;
  color: #888;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
}

.panel-close:hover { border-color: #555; color: #fff; }

.panel-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
}

.detail-loading {
  display: grid;
  min-height: 140px;
  place-items: center;
  color: #888;
  font-size: 13px;
}

.detail-loading::after {
  width: 18px;
  height: 18px;
  margin-top: 10px;
  border: 2px solid #333;
  border-top-color: #60a5fa;
  border-radius: 50%;
  content: '';
  animation: detailLoadingSpin .7s linear infinite;
}

@keyframes detailLoadingSpin { to { transform: rotate(360deg); } }

.detail-progress {
  margin: 12px 0;
  color: #777;
  font-size: 12px;
  text-align: center;
}

.detail-load-more {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 8px 12px;
  border: 1px solid #333;
  border-radius: 8px;
  background: transparent;
  color: #888;
  cursor: pointer;
}

.detail-load-more:hover { border-color: #555; color: #fff; }

.panel-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.5);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s;
}

.panel-overlay.open { opacity: 1; visibility: visible; }

/* Diff 对比视图 */
.diff-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #0f0f0f;
  display: none;
  z-index: 1001;
  flex-direction: column;
  overscroll-behavior: contain;
}
.diff-container.open { display: flex; }

.diff-header {
  height: 48px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 16px;
  background: #1a1a1a;
  border-bottom: 1px solid #2a2a2a;
  position: relative;
}

.diff-header-left {
  text-align: center;
  font-size: 13px;
  color: #888;
}

.diff-header-center {
  font-size: 14px;
  color: #fff;
  font-weight: 600;
}

.diff-header-right {
  text-align: center;
  font-size: 13px;
  color: #888;
  position: relative;
}

.diff-close-btn {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  padding: 6px 12px;
  border: 1px solid #333;
  border-radius: 6px;
  background: transparent;
  color: #888;
  font-size: 13px;
  cursor: pointer;
}
.diff-close-btn:hover { border-color: #555; color: #fff; }

.diff-body {
  flex: 1;
  display: flex;
  position: relative;
  overflow: hidden;
}

/* Minimap 在中间 */
.diff-minimap {
  width: 60px;
  background: #1a1a1a;
  border-left: 1px solid #2a2a2a;
  border-right: 1px solid #2a2a2a;
  position: relative;
  overflow: hidden;
  cursor: grab;
}

.diff-minimap:active { cursor: grabbing; }

.diff-minimap-items {
  position: absolute;
  top: 8px;
  left: 6px;
  right: 6px;
  bottom: 8px;
}

.diff-minimap-item {
  position: absolute;
  left: 0;
  right: 0;
  min-height: 4px;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
}

.diff-minimap-same { background: rgba(60,60,60,0.4); }
.diff-minimap-diff { background: #ef4444; }
.diff-minimap-added { background: #10b981; }
.diff-minimap-removed { background: #ef4444; }

.diff-minimap-item:hover { filter: brightness(1.5); }

/* 视口指示器 */
.diff-minimap-viewport {
  position: absolute;
  left: 3px;
  right: 3px;
  height: 24px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 3px;
  pointer-events: none;
  transition: top 0.05s;
}

/* 主内容区域 */
.diff-main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.diff-panel {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
  scrollbar-width: none;
}
.diff-panel::-webkit-scrollbar { display: none; }

.diff-panel-left {
  background: #1a1a1a;
}

.diff-panel-right {
  background: #1a1a1a;
}

/* 删除 gutter */
.diff-gutter { display: none; }

/* 消息样式 */
.diff-message {
  padding: 12px 16px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #2a2a2a;
}

.diff-message-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.diff-message-role {
  font-size: 12px;
  color: #666;
}

.diff-message-index {
  font-size: 12px;
  color: #555;
}

.diff-message-content {
  font-size: 14px;
  color: #e0e0e0;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.6;
}

.diff-same { background: transparent; }
.diff-diff { background: rgba(220,38,38,0.15); border-color: rgba(220,38,38,0.4); }
.diff-added { background: rgba(5,150,105,0.15); border-color: rgba(5,150,105,0.4); }
.diff-removed { background: rgba(220,38,38,0.15); border-color: rgba(220,38,38,0.4); }

.diff-diff .diff-message-role { color: #dc2626; }
.diff-added .diff-message-role { color: #059669; }
.diff-removed .diff-message-role { color: #dc2626; }

/* Token 级别差异 */
.diff-token { display: inline; }
.diff-token-same { }
.diff-token-added { background: rgba(5,150,105,0.3); color: #059669; }
.diff-token-removed { background: rgba(220,38,38,0.35); color: #dc2626; }
.diff-token-diff { background: rgba(220,38,38,0.5); color: #fff; }

/* 消息标题 */
.diff-messages-title {
  font-size: 12px;
  color: #666;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #2a2a2a;
}
</style>
</head>

<script>
// Lightning animation for logo
(function() {
  // 对齐 SVG 文字到 logo div
  function alignCurrentText() {
    const logo = document.getElementById('logo');
    const svg = document.getElementById('logoCurrentSvg');
    const text = document.getElementById('logoCurrent');
    if (!logo || !svg || !text) return;
    const w = logo.offsetWidth;
    const h = logo.offsetHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    text.setAttribute('x', w / 2);
    text.setAttribute('y', h / 2);
  }

  // 点亮 logo 和文字电流
  function illuminateLogo() {
    const logo = document.getElementById('logo');
    const textCurrent = document.getElementById('logoCurrent');
    if (!logo || !textCurrent) return;

    logo.classList.add('illuminated');
    textCurrent.classList.add('active');

    // 移除点亮效果
    setTimeout(() => {
      logo.classList.remove('illuminated');
    }, 300);

    // 重置文字电流
    setTimeout(() => {
      textCurrent.classList.remove('active');
    }, 650);
  }

  // 启动闪电动画（只执行一次）
  function startLightning() {
    const main = document.getElementById('lightningMain');
    const branches = document.querySelectorAll('.lightning-branch');
    if (!main) return;

    // 只在第一次添加 active 类，之后 CSS 动画自然循环
    main.classList.add('active');
    branches.forEach(b => b.classList.add('active'));

    // 监听 CSS 动画每次循环开始
    main.addEventListener('animationiteration', () => {
      // CSS 动画周期开始，在主闪时刻(850ms)点亮
      setTimeout(illuminateLogo, 850);
    });

    // 第一次点亮（初始延迟 + 850ms）
    setTimeout(illuminateLogo, 500 + 850);
  }

  // 初始化
  window.addEventListener('load', () => {
    alignCurrentText();
    setTimeout(startLightning, 500);
  });
})();

// 拆分日期和时间，只让时间部分 hover 高亮
function splitTime(time) {
  if (!time) return '';
  const parts = time.split(' ');
  if (parts.length === 2) {
    return `<span class="log-time-date">${parts[0]}</span> <span class="log-time-clock">${parts[1]}</span>`;
  }
  return time;
}

let autoRefreshEnabled = true;
let sseConnection = null;
let expandedLogId = null;
let viewModes = {}; // 存储每条日志的视图模式: 'friendly' 或 'raw'
let appContextLength = 200000;
let tokenTrendGranularity = 'daily';
let tokenCharts = [];
let tokenRequestPeriod = 7;
let tokenRequestOffset = 0;
let tokenRequestData = null;
let tokenDashboardRequestId = 0;
let tokenRequestRequestId = 0;
let tokenDashboardTrigger = null;
const MAX_VISIBLE_LOGS = 50;
const MAX_REALTIME_LOGS_PER_FRAME = 10;
const pendingRealtimeLogs = new Map();
const logAnalysisCache = new Map();
let realtimeLogFrame = null;
let detailRenderGeneration = 0;
const DETAIL_MESSAGE_BATCH_SIZE = 12;
const MAX_DETAIL_TOKENIZED_MESSAGES = 24;
const MAX_DETAIL_TOKENIZED_CHARS = 16000;
const DETAIL_TOOL_STATS_MESSAGES = 100;
const DETAIL_TOOL_STATS_BLOCKS = 24;
const detailMessageOffsets = new Map();

async function loadAppInfo() {
  try {
    const res = await fetch('/api/info');
    const info = await res.json();
    appContextLength = info.contextLength ?? 200000;
  } catch (err) {
    console.warn('加载服务配置失败:', err);
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadAppInfo();
  fetchLogs(); // 初始加载
  startSseConnection();

  // ESC 键关闭侧边栏和对比视图
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      // 先检查对比视图
      const diffContainer = document.getElementById('diffContainer');
      if (diffContainer.classList.contains('open')) {
        closeDiffView();
        return;
      }
      // 再检查侧边栏
      const slidePanel = document.getElementById('slidePanel');
      if (slidePanel.classList.contains('open')) {
        closePanel();
        return;
      }
      if (document.getElementById('tokenDashboard').classList.contains('open')) {
        closeTokenDashboard();
      }
    }
  });
});

function trimCurrentLogs() {
  if (!window.currentLogs) window.currentLogs = [];
  if (window.currentLogs.length > MAX_VISIBLE_LOGS) window.currentLogs = window.currentLogs.slice(-MAX_VISIBLE_LOGS);
  const visibleIds = new Set(window.currentLogs.map(log => log.id));
  for (const key of logAnalysisCache.keys()) {
    if (!visibleIds.has(Number(String(key).split(':', 1)[0]))) logAnalysisCache.delete(key);
  }
}

function flushRealtimeLogs() {
  realtimeLogFrame = null;
  if (document.hidden || pendingRealtimeLogs.size === 0) return;
  if (!window.currentLogs) window.currentLogs = [];
  const knownIds = new Set(window.currentLogs.map(log => log.id));
  const batch = [];
  for (const [id, log] of pendingRealtimeLogs) {
    pendingRealtimeLogs.delete(id);
    if (!knownIds.has(id)) {
      window.currentLogs.push(log);
      knownIds.add(id);
      batch.push(log);
    }
    if (batch.length >= MAX_REALTIME_LOGS_PER_FRAME) break;
  }
  trimCurrentLogs();
  const container = document.getElementById('logContainer');
  if (batch.length > 0) {
    if (container.querySelector('.empty-state')) container.innerHTML = '';
    container.insertAdjacentHTML('afterbegin', batch.reverse().map(renderSingleLogCard).join(''));
    const cards = container.querySelectorAll('.log-card');
    for (let index = MAX_VISIBLE_LOGS; index < cards.length; index++) cards[index].remove();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (pendingRealtimeLogs.size > 0) scheduleRealtimeLogFlush();
}

function scheduleRealtimeLogFlush() {
  if (document.hidden || realtimeLogFrame !== null) return;
  realtimeLogFrame = requestAnimationFrame(flushRealtimeLogs);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) scheduleRealtimeLogFlush();
});

function startSseConnection() {
  if (sseConnection) return;

  sseConnection = new EventSource('/api/logs/stream');
  updateStatus(true);

  sseConnection.addEventListener('new-log', (e) => {
    try {
      const newLog = JSON.parse(e.data);
      pendingRealtimeLogs.set(newLog.id, newLog);
      while (pendingRealtimeLogs.size > MAX_VISIBLE_LOGS) {
        pendingRealtimeLogs.delete(pendingRealtimeLogs.keys().next().value);
      }
      scheduleRealtimeLogFlush();
    } catch (err) {
      console.error('SSE new-log parse error:', err);
    }
  });

  sseConnection.addEventListener('clear-logs', () => {
    pendingRealtimeLogs.clear();
    logAnalysisCache.clear();
    detailRenderGeneration++;
    if (realtimeLogFrame !== null) cancelAnimationFrame(realtimeLogFrame);
    realtimeLogFrame = null;
    window.currentLogs = [];
    expandedLogId = null;
    viewModes = {};
    renderLogs([]);
  });

  sseConnection.onerror = () => {
    console.log('SSE connection error, will reconnect');
    updateStatus(false, '重连中');
    sseConnection.close();
    sseConnection = null;
    // 5秒后重连
    setTimeout(() => {
      if (autoRefreshEnabled) startSseConnection();
    }, 5000);
  };

  updateAutoRefreshBtn();
}

function stopSseConnection() {
  if (sseConnection) {
    sseConnection.close();
    sseConnection = null;
  }
  pendingRealtimeLogs.clear();
  if (realtimeLogFrame !== null) cancelAnimationFrame(realtimeLogFrame);
  realtimeLogFrame = null;
  updateStatus(false);
}

function updateStatus(connected, text = null) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusText');
  if (connected) {
    dot.style.background = '#059669';
    label.textContent = text || '已连接';
  } else {
    dot.style.background = '#dc2626';
    label.textContent = text || '已断开';
  }
}

function updateAutoRefreshBtn() {
  const btn = document.getElementById('autoRefreshBtn');
  if (autoRefreshEnabled) {
    btn.className = 'btn active-snake';

async function fetchLogs() {

function formatTokenMetric(value) {
  return new Intl.NumberFormat('zh-CN', { notation: 'compact', maximumFractionDigits: 1 }).format(value || 0);
}

function formatRate(value) {
  return `${new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 1 }).format(value || 0)} tok/s`;
}

function formatDetailedTokenMetric(value) {
  const amount = Number(value);
  if (!Number.isFinite(amount)) return String(value);
  if (amount >= 1000000) return `${(amount / 1000000).toFixed(2)}M`;
  if (amount >= 1000) return `${(amount / 1000).toFixed(2)}k`;
  return String(amount);
}

function destroyTokenCharts() {
  tokenCharts.forEach(chart => chart.destroy());
  tokenCharts = [];
}

function trendDatasets(items) {
  const buckets = items.map(item => {
    const input = Number(item.inputTokens || 0);
    const output = Number(item.outputTokens || 0);
    const cacheRead = Number(item.cacheReadTokens || 0);
    const cacheCreation = Number(item.cacheCreationTokens || 0);
    const cacheMiss = input - cacheRead;
    const total = Number(item.totalTokens || 0);
    if ([input, output, cacheRead, cacheCreation, total].some(value => !Number.isFinite(value) || value < 0)
        || cacheRead + cacheCreation > input || input + output !== total) {
      throw new Error(`Token 数据口径异常：${item.bucket}`);
    }
    return { ...item, input, output, cacheRead, cacheCreation, cacheMiss, total };
  });
  return {
    buckets,
    labels: buckets.map(item => tokenTrendGranularity === 'hourly' ? `${item.bucket.slice(11)}:00` : item.bucket.slice(5)),
    cacheRead: buckets.map(item => item.cacheRead),
    cacheMiss: buckets.map(item => item.cacheMiss),
    output: buckets.map(item => item.output),
    total: buckets.map(item => item.total),
  };
}

function createTokenChart(canvas, config) {
  if (!window.Chart) {
    canvas.parentElement.innerHTML = '<div class="token-chart-error">图表组件加载失败，请检查网络后重试</div>';
    return null;
  }
  const chart = new Chart(canvas, config);
  tokenCharts.push(chart);
  return chart;
}

function tokenTooltipTitle(bucket) {
  if (tokenTrendGranularity === 'hourly') return `${bucket.bucket.slice(0, 10)} ${bucket.bucket.slice(11)}:00–${bucket.bucket.slice(11)}:59`;
  return bucket.bucket;
}

function trendLabels(items) {
  return items.map(item => tokenTrendGranularity === 'hourly' ? `${item.bucket.slice(11)}:00` : item.bucket.slice(5));
}

function renderRequestTrendChart(data) {

  createTokenChart(document.getElementById('requestTrendChart'), {
    type: 'line',

      label: 'API 请求次数', data: counts, borderColor: '#2878f0', backgroundColor: 'rgba(85,184,243,.58)',

function renderTokenTrendChart(data) {
  const chartHost = document.getElementById('tokenTrendChartHost');
  const totalNode = document.getElementById('tokenTrendTotal');
  const rangeNode = document.getElementById('tokenTrendRange');
  const hourButton = document.getElementById('tokenHourlyButton');
  const dailyButton = document.getElementById('tokenDailyButton');
  if (!chartHost || !totalNode || !rangeNode) return;
  tokenCharts.filter(chart => chart.canvas?.id === 'tokenTrendChart').forEach(chart => chart.destroy());
  tokenCharts = tokenCharts.filter(chart => chart.canvas?.id !== 'tokenTrendChart');
  chartHost.innerHTML = '<canvas id="tokenTrendChart" role="img" aria-label="Token 用量堆叠柱状图"></canvas>';
  hourButton?.classList.toggle('active', tokenTrendGranularity === 'hourly');
  dailyButton?.classList.toggle('active', tokenTrendGranularity === 'daily');
  hourButton?.setAttribute('aria-pressed', String(tokenTrendGranularity === 'hourly'));
  dailyButton?.setAttribute('aria-pressed', String(tokenTrendGranularity === 'daily'));
  const items = data.trends?.[tokenTrendGranularity] || [];
  try {
    const trend = trendDatasets(items);
    const rangeTotal = trend.total.reduce((sum, value) => sum + value, 0);
    totalNode.textContent = formatTokenMetric(rangeTotal);
    rangeNode.textContent = tokenTrendGranularity === 'hourly'
      ? `今日按小时 · ${data.range?.timezone || '服务端本地时间'}`
      : `${data.range?.from || ''} 至 ${data.range?.to || ''} · ${data.range?.timezone || '服务端本地时间'}`;
    if (!trend.total.some(Boolean)) {
      chartHost.innerHTML = '<div class="token-request-empty">这段时间还没有 Token 用量</div>';
      return;
    }
    const colors = ['#55b8f3', '#2878f0', '#34d399'];
    createTokenChart(document.getElementById('tokenTrendChart'), {
      type: 'bar',
      data: { labels: trend.labels, datasets: [
        { label: '输入（命中缓存）', data: trend.cacheRead, backgroundColor: colors[0], borderWidth: 0 },
        { label: '输入（未命中缓存）', data: trend.cacheMiss, backgroundColor: colors[1], borderWidth: 0 },
        { label: '输出', data: trend.output, backgroundColor: colors[2], borderWidth: 0, borderRadius: 3 },
      ] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? false : undefined,
        interaction: { mode: 'index', intersect: false },
        datasets: { bar: { categoryPercentage: .72, barPercentage: .82, maxBarThickness: 40 } },
        plugins: {
          legend: { position: 'bottom', labels: { color: '#aaa', boxWidth: 10, boxHeight: 10, padding: 18 } },
          tooltip: {
            backgroundColor: 'rgba(25,25,25,.96)', padding: 14, boxPadding: 5,
            callbacks: {
              title: contexts => tokenTooltipTitle(trend.buckets[contexts[0].dataIndex]),
              label: context => {
                const total = trend.total[context.dataIndex];
                const value = Number(context.raw || 0);
                const percent = total > 0 ? ` · ${(value / total * 100).toFixed(1)}%` : '';
                return `${context.dataset.label}  ${new Intl.NumberFormat('zh-CN').format(value)}${percent}`;
              },
              footer: contexts => {
                const bucket = trend.buckets[contexts[0].dataIndex];
                const created = bucket.cacheCreation > 0 ? `\n缓存写入  ${new Intl.NumberFormat('zh-CN').format(bucket.cacheCreation)}` : '';
                return `总计  ${new Intl.NumberFormat('zh-CN').format(bucket.total)}${created}`;
              },
            },
          },
        },
        scales: {
          x: { stacked: true, ticks: { color: '#999', maxRotation: 0 }, grid: { display: false } },
          y: { stacked: true, beginAtZero: true, ticks: { color: '#999', callback: value => formatTokenMetric(value) }, grid: { color: '#323232' }, border: { display: false } },
        },
      },
    });
  } catch (error) {
    totalNode.textContent = '—';
    rangeNode.textContent = '';
    chartHost.innerHTML = `<div class="token-chart-error">${escapeHtml(error.message || String(error))}</div>`;
  }
}

function formatRequestTime(value) {
  const date = new Date(value);
  const parts = new Intl.DateTimeFormat('zh-CN', {
    month: 'numeric', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).formatToParts(date);
  const part = type => parts.find(item => item.type === type)?.value || '';
  return `${part('month')}月${part('day')}日 ${part('hour')}:${part('minute')}:${part('second')}`;
}

function renderTokenRequestList(data) {
  const list = document.getElementById('tokenRequestList');
  const meta = document.getElementById('tokenRequestMeta');
  const pagination = document.getElementById('tokenRequestPagination');
  if (!list || !meta || !pagination) return;
  if (!data) {
    meta.textContent = '加载中…';
    list.innerHTML = '<div class="token-request-empty">加载请求明细…</div>';
    pagination.innerHTML = '';
    return;
  }
  meta.textContent = `最近 ${tokenRequestPeriod} 天 · 共 ${data.total} 次请求`;
  if (!data.items?.length) {
    list.innerHTML = '<div class="token-request-empty">这段时间还没有请求记录。</div>';
    pagination.innerHTML = '';
    return;
  }
  list.innerHTML = data.items.map(item => {
    const uncached = (item.inputTokens || 0) - (item.cacheReadTokens || 0);
    const validAccounting = uncached >= 0
      && (item.cacheReadTokens || 0) + (item.cacheCreationTokens || 0) <= (item.inputTokens || 0)
      && (item.inputTokens || 0) + (item.outputTokens || 0) === (item.totalTokens || 0);
    if (!validAccounting) return `<article class="token-request-row"><div class="token-request-time">${formatRequestTime(item.occurredAt)}</div><div class="token-request-model"><strong>${escapeHtml(item.model)}</strong><span>${escapeHtml(item.upstream)}</span></div><div class="token-chart-error" style="grid-column:span 4">Token 数据口径异常</div></article>`;
    return `<article class="token-request-row">
      <time class="token-request-time" datetime="${escapeHtml(item.occurredAt)}">${formatRequestTime(item.occurredAt)}</time>
      <div class="token-request-model"><strong title="${escapeHtml(item.model)}">${escapeHtml(item.model)}</strong><span title="${escapeHtml(item.upstream)}">${escapeHtml(item.upstream)}</span></div>
      <div class="token-request-number">${formatTokenMetric(uncached)}</div>
      <div class="token-request-number">${formatTokenMetric(item.cacheReadTokens)}</div>
      <div class="token-request-number">${formatTokenMetric(item.outputTokens)}</div>
      <div class="token-request-number total">${formatTokenMetric(item.totalTokens)}</div>
    </article>`;
  }).join('');
  const hasPrevious = data.offset > 0;
  const hasNext = data.offset + data.items.length < data.total;
  const currentPage = Math.floor(data.offset / data.limit) + 1;
  const totalPages = Math.ceil(data.total / data.limit);
  const pageNumbers = tokenRequestPageNumbers(currentPage, totalPages);
  const pageButtons = pageNumbers.map(page => `<button type="button" class="token-page-button${page === currentPage ? ' active' : ''}" onclick="changeTokenRequestPage(${page})"${page === currentPage ? ' aria-current="page"' : ''} aria-label="第 ${page} 页">${page}</button>`).join('');
  pagination.innerHTML = `<button type="button" class="btn token-page-nav" onclick="changeTokenRequestPage(${currentPage - 1})" ${hasPrevious ? '' : 'disabled'}>上一页</button>${pageButtons}<button type="button" class="btn token-page-nav" onclick="changeTokenRequestPage(${currentPage + 1})" ${hasNext ? '' : 'disabled'}>下一页</button>`;
}

function tokenRequestPageNumbers(currentPage, totalPages, maxVisible = 9) {
  if (totalPages <= 0) return [];
  const visible = Math.min(totalPages, maxVisible);
  const start = Math.min(Math.max(currentPage - Math.floor(visible / 2), 1), totalPages - visible + 1);
  return Array.from({ length: visible }, (_, index) => start + index);
}

async function loadTokenRequests() {
  const requestId = ++tokenRequestRequestId;
  tokenRequestData = null;
  renderTokenRequestList(null);
  try {
    const response = await fetch(`/api/token-usage/requests?days=${tokenRequestPeriod}&limit=20&offset=${tokenRequestOffset}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (requestId !== tokenRequestRequestId || !document.getElementById('tokenDashboard').classList.contains('open')) return;
    tokenRequestData = data;
    renderTokenRequestList(data);
  } catch (error) {
    if (requestId !== tokenRequestRequestId) return;
    console.error('loadTokenRequests error:', error);
    const list = document.getElementById('tokenRequestList');
    if (list) list.innerHTML = '<div class="token-request-empty">请求明细加载失败。</div>';
  }
}

async function loadTokenDashboard() {
  const requestId = ++tokenDashboardRequestId;
  const body = document.getElementById('tokenDashboardBody');
  body.className = 'token-dashboard-loading';
  body.textContent = '加载统计中…';
  try {
    const response = await fetch('/api/token-usage?days=7');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (requestId !== tokenDashboardRequestId || !document.getElementById('tokenDashboard').classList.contains('open')) return;
    window.tokenDashboardData = data;
    renderTokenDashboard(data);
    void loadTokenRequests();
  } catch (error) {
    if (requestId !== tokenDashboardRequestId) return;
    console.error('loadTokenDashboard error:', error);
    body.textContent = '统计加载失败，请稍后重试。';
  }
}

function openTokenDashboard() {
  tokenDashboardTrigger = document.activeElement;
  document.getElementById('tokenDashboard').classList.add('open');
  document.body.classList.add('token-dashboard-open');
  document.querySelector('#tokenDashboard .panel-close')?.focus();
  void loadTokenDashboard();
}

function closeTokenDashboard() {
  tokenDashboardRequestId++;
  tokenRequestRequestId++;
  document.getElementById('tokenDashboard').classList.remove('open');
  document.body.classList.remove('token-dashboard-open');
  destroyTokenCharts();
  tokenDashboardTrigger?.focus?.();
}

function setTokenTrendGranularity(granularity) {
  if (granularity !== 'daily' && granularity !== 'hourly') return;
  tokenTrendGranularity = granularity;
  if (window.tokenDashboardData) {
    renderTokenTrendChart(window.tokenDashboardData);
    renderRequestTrendChart(window.tokenDashboardData);
  }
}

function setTokenRequestPeriod(days) {
  tokenRequestPeriod = days;
  tokenRequestOffset = 0;
  document.querySelectorAll('.token-request-toolbar .token-switch button').forEach(button => {
    const active = button.textContent === `${days}d`;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
  });
  void loadTokenRequests();
}

function changeTokenRequestPage(page) {
  if (!tokenRequestData || !Number.isInteger(page)) return;
  const totalPages = Math.ceil(tokenRequestData.total / tokenRequestData.limit);
  if (page < 1 || page > totalPages) return;
  tokenRequestOffset = (page - 1) * tokenRequestData.limit;
  void loadTokenRequests();
}

function detailTaskIsCurrent(generation, logId) {
  return generation === detailRenderGeneration && expandedLogId === logId && document.getElementById('slidePanel').classList.contains('open');
}

function yieldDetailRender() {
  return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

function showDetailLoading(panelBody, message) {
  panelBody.innerHTML = `<div class="detail-loading">${message}</div>`;
}

async function renderDetailAsync(log, generation) {
  const panelBody = document.getElementById('panelBody');
  const mode = viewModes[log.id] || 'friendly';
  if (!panelBody || !detailTaskIsCurrent(generation, log.id)) return;
  if (mode === 'raw') {
    await yieldDetailRender();
    if (!detailTaskIsCurrent(generation, log.id)) return;
    const detail = renderDetailContent(log);
    logAnalysisCache.set(`${log.id}:${mode}`, detail);
    panelBody.innerHTML = detail;
    return;
  }

  panelBody.innerHTML = `${renderDetailControls(log, mode)}${log.error ? `<div class="detail-error">${log.error}</div>` : ''}<div class="friendly-view"><div class="detail-progress">正在分析 Token 与响应…</div></div>`;
  await yieldDetailRender();
  if (!detailTaskIsCurrent(generation, log.id)) return;

  const messages = Array.isArray(log.request?.messages) ? log.request.messages : [];
  const intro = renderFriendlyDetailIntro(log);
  panelBody.innerHTML = `${renderDetailControls(log, mode)}${log.error ? `<div class="detail-error">${log.error}</div>` : ''}${intro}<div id="detailMessages"></div><div id="detailProgress" class="detail-progress"></div></div>`;
  await yieldDetailRender();
  if (!detailTaskIsCurrent(generation, log.id)) return;

  detailMessageOffsets.set(log.id, 0);
  renderNextDetailMessageBatch(log, generation);
}

function renderNextDetailMessageBatch(log, generation) {
  if (!detailTaskIsCurrent(generation, log.id)) return;
  const messages = Array.isArray(log.request?.messages) ? log.request.messages : [];
  const start = detailMessageOffsets.get(log.id) ?? 0;
  const target = document.getElementById('detailMessages');
  const progress = document.getElementById('detailProgress');
  if (!target || !progress) return;
  const html = renderFriendlyRequestMessages(messages, start, DETAIL_MESSAGE_BATCH_SIZE);
  if (html) target.insertAdjacentHTML('beforeend', html);
  const next = Math.min(start + DETAIL_MESSAGE_BATCH_SIZE, messages.length);
  detailMessageOffsets.set(log.id, next);
  if (next < messages.length) {
    progress.innerHTML = `${next}/${messages.length} 条历史消息已加载<button type="button" class="detail-load-more" onclick="loadMoreDetailMessages(${log.id}, ${generation})">继续加载</button>`;
  } else {
    progress.textContent = messages.length > DETAIL_MESSAGE_BATCH_SIZE ? `已加载全部 ${messages.length} 条历史消息` : '';
    if (messages.length <= DETAIL_MESSAGE_BATCH_SIZE) {
      const detail = `${renderDetailControls(log, viewModes[log.id] || 'friendly')}${log.error ? `<div class="detail-error">${log.error}</div>` : ''}${renderFriendlyDetailIntro(log)}${renderFriendlyRequestMessages(messages, 0, messages.length)}</div>`;
      logAnalysisCache.set(`${log.id}:friendly`, detail);
    }
  }
}

function loadMoreDetailMessages(logId, generation) {
  const log = window.currentLogs?.find(item => item.id === logId);
  if (!log || !detailTaskIsCurrent(generation, logId)) return;
  const progress = document.getElementById('detailProgress');
  if (progress) progress.textContent = '正在加载更多历史消息…';
  requestAnimationFrame(() => {
    if (detailTaskIsCurrent(generation, logId)) renderNextDetailMessageBatch(log, generation);
  });
}

function toggleViewMode(logId, mode) {
  viewModes[logId] = mode;
  const log = window.currentLogs?.find(item => item.id === logId);
  if (!log || expandedLogId !== logId) return;
  const generation = ++detailRenderGeneration;
  const panelBody = document.getElementById('panelBody');
  if (panelBody) showDetailLoading(panelBody, '正在切换详情视图…');
  void renderDetailAsync(log, generation);
}

function parseSseResponse(response) {
  if (!response || typeof response !== 'object') return null;
  const stats = { textLen: 0, thinkingLen: 0, frameCount: 0, usage: null };
  if (response.format === 'sse') {
    stats.frameCount = response.frameCount || 0;
    stats.textLen = response.assistantText?.length || 0;
    stats.thinkingLen = response.thinking?.length || 0;
    if (response.usage) stats.usage = response.usage;
  }
  return stats;
}

// 获取完整文本
function getText(text) {
  if (!text) return '';
  return typeof text === 'string' ? text : JSON.stringify(text);
}

function findPreviousSessionPost(log) {
  if (!log.cacheScope || !window.currentLogs) return null;
  const currentIndex = window.currentLogs.findIndex(l => l.id === log.id);
  for (let i = currentIndex - 1; i >= 0; i--) {
    const previous = window.currentLogs[i];
    if (previous.method === 'POST' && previous.cacheScope === log.cacheScope) return previous;
  }
  return null;
}

function renderAuthoritativeUsage(log, usage) {
  const modelName = log.response?.message?.model || log.model || log.request?.model || 'unknown';
  const uncachedInput = Math.max(0, usage.input - usage.cacheRead);
  const barBase = Math.max(appContextLength || 0, usage.total, 1);
  const pctOfBar = value => value / barBase * 100;
  const cachePct = usage.input > 0 ? usage.cacheRead / usage.input * 100 : 0;
  const inputPct = usage.input > 0 ? uncachedInput / usage.input * 100 : 0;
  const outputPct = usage.total > 0 ? usage.output / usage.total * 100 : 0;
  const freeTokens = Math.max(0, (appContextLength || usage.total) - usage.total);
  const fmt = value => new Intl.NumberFormat('zh-CN').format(value);
  const fmtPct = value => value.toFixed(2);
  const barWidth = value => Math.max(5, Math.min(100, value));
  const totalSummary = appContextLength
    ? `${(usage.total / 1000).toFixed(2)}k/${(appContextLength / 1000).toFixed(0)}k tokens (${fmtPct(usage.total / appContextLength * 100)}%)`
    : `${fmt(usage.total)} tokens`;
  const cacheClass = log.cacheDrop ? 'dist-cat-cache-warning' : 'dist-cat-cache';
  const cacheValueClass = log.cacheDrop ? 'dist-cat-value cache-warning' : 'dist-cat-value cache';
  const durationSec = (log.duration || 0) / 1000;
  const rate = usage.output > 0 && durationSec > 0 ? Math.round(usage.output / durationSec) : 0;
  const sseFrameCount = Number(log.response?.frameCount || 0);
  const messageLength = String(log.response?.assistantText || '').length;
  const toolNames = Array.isArray(log.response?.toolCalls)
    ? log.response.toolCalls.map(call => call?.name).filter(name => typeof name === 'string' && name.length > 0).join('、')
    : '';
  const metadata = [
    `耗时 <span class="dist-cat-value orange">${log.duration ?? '-'}ms</span>`,
    sseFrameCount > 0 ? `SSE帧数 <span class="dist-cat-value">${sseFrameCount}</span>` : '',
    messageLength > 0 ? `消息长度 <span class="dist-cat-value">${messageLength}</span>` : '',
    toolNames ? `工具调用 <span class="dist-cat-value tool">${escapeHtml(toolNames)}</span>` : '',
    rate > 0 ? `Token速率 <span class="dist-cat-value green">${rate} token/s</span>` : '',
  ].filter(Boolean).join('<span class="dist-meta-sep">·</span>');

  return `<div class="dist-bar-container">
    <div class="dist-header"><div class="dist-model">${escapeHtml(modelName)}</div><div class="dist-total">${totalSummary}</div></div>
    <div class="dist-bar">
      ${usage.cacheRead > 0 ? `<div class="dist-seg seg-cache" style="width:${pctOfBar(usage.cacheRead)}%"></div>` : ''}
      ${uncachedInput > 0 ? `<div class="dist-seg seg-user" style="width:${pctOfBar(uncachedInput)}%"></div>` : ''}
      ${usage.output > 0 ? `<div class="dist-seg seg-text" style="width:${pctOfBar(usage.output)}%"></div>` : ''}
      ${freeTokens > 0 ? `<div class="dist-seg seg-free" style="width:${pctOfBar(freeTokens)}%"></div>` : ''}
    </div>
    <div class="dist-categories">
      <div class="dist-cat-label" style="margin-bottom:8px;color:#666">Messages</div>
      ${usage.cacheRead > 0 || log.cacheDrop ? `<div class="dist-category ${cacheClass}"><div class="dist-cat-label">Cache</div><div class="dist-cat-bar"><div class="dist-cat-fill seg-cache" style="width:${barWidth(cachePct)}%"></div></div><div class="${cacheValueClass}">${fmt(usage.cacheRead)} (${fmtPct(cachePct)}%)${log.cacheDrop ? ` 缓存读取下降 -${fmt(log.cacheDrop.lostTokens)}` : ''}</div></div>` : ''}
      <div class="dist-category"><div class="dist-cat-label">Input</div><div class="dist-cat-bar"><div class="dist-cat-fill seg-user" style="width:${barWidth(inputPct)}%"></div></div><div class="dist-cat-value blue">${fmt(uncachedInput)} (${fmtPct(inputPct)}%)</div></div>
      <div class="dist-cat-label" style="margin-top:12px;margin-bottom:8px;color:#666">Output</div>
      <div class="dist-category"><div class="dist-cat-label">Response</div><div class="dist-cat-bar"><div class="dist-cat-fill seg-text" style="width:${barWidth(outputPct)}%"></div></div><div class="dist-cat-value green">${fmt(usage.output)} (${fmtPct(outputPct)}%)</div></div>
      ${appContextLength ? `<div class="dist-cat-label" style="margin-top:12px;margin-bottom:8px;color:#666">Available</div><div class="dist-category"><div class="dist-cat-label">Free</div><div class="dist-cat-bar"><div class="dist-cat-fill seg-free" style="width:${barWidth(pctOfBar(freeTokens))}%"></div></div><div class="dist-cat-value">${fmt(freeTokens)} (${fmtPct(pctOfBar(freeTokens))}%)</div></div>` : ''}
    </div>
    <div class="dist-categories" style="margin-top:12px;padding-top:8px;border-top:1px solid #2a2a2a"><div class="dist-meta-line">${metadata}</div></div>
  </div>`;
}

function buildDistBar(log) {
  if (log.error) {
    return `<div class="dist-bar-container">
      <div class="dist-category">
        <div class="dist-cat-label" style="color:#dc2626">错误</div>
        <div class="dist-cat-value highlight" style="color:#dc2626">${escapeHtml(getText(log.error))}</div>
      </div>
    </div>`;
  }
  const authoritativeUsage = normalizedLogUsage(log);
  if (authoritativeUsage) return renderAuthoritativeUsage(log, authoritativeUsage);

  // 仅在上游没有 usage 时，按需估算单条详情的 Token 分布。
  const messages = log.request?.messages || [];
  const detailMessages = messages.length > MAX_DETAIL_TOKENIZED_MESSAGES ? messages.slice(-MAX_DETAIL_TOKENIZED_MESSAGES) : messages;
  const userMsgs = detailMessages.filter(m => m.role === 'user');
  const assistantMsgs = detailMessages.filter(m => m.role === 'assistant');
  const systemMsgs = detailMessages.filter(m => m.role === 'system');
  const requestSystem = log.request?.system;

  // 详情页分词有明确上限，避免单个超长历史消息阻塞交互。
  const countTokens = (text) => {
    const source = getText(text);
    const t = source.length > MAX_DETAIL_TOKENIZED_CHARS ? source.slice(0, MAX_DETAIL_TOKENIZED_CHARS) : source;
    if (!t) return 0;
    try {
      return GPTTokenizer_cl100k_base.encode(t).length;
    } catch {
      return Math.ceil(t.length / 2);
    }
  };

  const systemTokens = systemMsgs.reduce((sum, m) => sum + countTokens(m.content), 0)
    + (requestSystem ? countTokens(requestSystem) : 0);
  const assistantTokens = assistantMsgs.reduce((sum, m) => sum + countTokens(m.content), 0);
  const userTokens = userMsgs.reduce((sum, m) => sum + countTokens(m.content), 0);
  const requestTotal = systemTokens + assistantTokens + userTokens;

  // 分析响应
  const sseStats = parseSseResponse(log.response);

  // 精确计算响应 token
  const thinkingTokens = countTokens(log.response?.thinking || '');
  const textTokens = countTokens(log.response?.assistantText || '');
  const responseTotal = thinkingTokens + textTokens;

  // 获取内容
  const lastUserContent = userMsgs.length > 0 ? getText(userMsgs[userMsgs.length - 1].content) : '';
  const responseText = sseStats?.textLen > 0 ? getText(log.response.assistantText) : '';
  const thinkingText = sseStats?.thinkingLen > 0 ? getText(log.response.thinking) : '';

  const modelName = log.response?.message?.model || log.request?.model || 'unknown';
  const maxContext = appContextLength;

  let html = '<div class="dist-bar-container">';

  const fmtPct = (v) => v.toFixed(2);
  const fmtTokens = (v) => v >= 1000 ? (v / 1000).toFixed(2) + 'k' : v.toString();
  const toPct = (v) => Math.round(v * 100) / 100;
  const pctOf = (tokens, base) => base > 0 ? toPct((tokens / base) * 100) : 0;

  const usage = sseStats?.usage || log.response?.usage;
  const hasUsage = usage?.input_tokens !== undefined;
  const cacheTokens = usage?.cache_read_input_tokens || 0;

  let totalInput;
  if (hasUsage) {
    totalInput = usage.input_tokens + cacheTokens;
  } else {
    totalInput = requestTotal;
  }
  const totalWithCache = totalInput + responseTotal;
  const barBase = maxContext || totalWithCache || 1;

  const totalK = (totalWithCache / 1000).toFixed(2);
  const totalSummary = maxContext
    ? `${totalK}k/${(maxContext / 1000).toFixed(0)}k tokens (${fmtPct(pctOf(totalWithCache, maxContext))}%)`
    : `${totalK}k tokens`;

  html += `<div class="dist-header">
    <div class="dist-model">${escapeHtml(modelName)}</div>
    <div class="dist-total">${totalSummary}</div>
  </div>`;

  const systemPct = toPct(Math.max(systemTokens > 0 ? 2 : 0, pctOf(systemTokens, barBase)));
  const assistantPct = toPct(Math.max(0, pctOf(assistantTokens, barBase)));
  const userPct = toPct(Math.max(0, pctOf(userTokens, barBase)));
  const thinkingPct = toPct(Math.max(0, pctOf(thinkingTokens, barBase)));
  const textPct = toPct(Math.max(0, pctOf(textTokens, barBase)));
  const usedPctSum = systemPct + assistantPct + userPct + thinkingPct + textPct;
  const freePct = maxContext ? toPct(Math.max(0, 100 - usedPctSum)) : 0;

  html += '<div class="dist-bar">';
  if (systemPct > 1) html += `<div class="dist-seg seg-system" style="width:${systemPct}%"></div>`;
  if (assistantPct > 1) html += `<div class="dist-seg seg-assistant" style="width:${assistantPct}%"></div>`;
  if (userPct > 1) html += `<div class="dist-seg seg-user" style="width:${userPct}%"></div>`;
  if (thinkingPct > 1) html += `<div class="dist-seg seg-thinking" style="width:${thinkingPct}%"></div>`;
  if (textPct > 1) html += `<div class="dist-seg seg-text" style="width:${textPct}%"></div>`;
  if (freePct > 1) html += `<div class="dist-seg seg-free" style="width:${freePct}%"></div>`;
  html += '</div>';

  // === 分类详情 ===
  html += '<div class="dist-categories">';

  // Messages 分组
  const showMessages = systemTokens > 0 || assistantTokens > 0 || userTokens > 0;
  if (showMessages) {
    html += '<div class="dist-cat-label" style="margin-bottom:8px;color:#666">Messages</div>';
  }

  // 进度条宽度：直接用百分比，最小 5%
  const barWidth = (pct) => Math.max(5, Math.min(100, pct));

  if (systemTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">System</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-system" style="width:${barWidth(systemPct)}%"></div></div>
      <div class="dist-cat-value">${fmtTokens(systemTokens)} (${fmtPct(systemPct)}%)</div>
    </div>`;
  }

  if (assistantTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">Assistant</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-assistant" style="width:${barWidth(assistantPct)}%"></div></div>
      <div class="dist-cat-value purple">${fmtTokens(assistantTokens)} (${fmtPct(assistantPct)}%)</div>
    </div>`;
  }

  if (userTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">User</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-user" style="width:${barWidth(userPct)}%"></div></div>
      <div class="dist-cat-value blue">${fmtTokens(userTokens)} (${fmtPct(userPct)}%)</div>
    </div>`;
  }

  // Cache 和 Input 显示（如果有 cache 或检测到 cache 下降）
  if (cacheTokens > 0 || log.cacheDrop) {
    const actualInput = hasUsage ? usage.input_tokens : requestTotal;
    const totalInputWithCache = actualInput + cacheTokens;
    const cachePct = (cacheTokens / totalInputWithCache) * 100;
    const inputPct = (actualInput / totalInputWithCache) * 100;

    const cacheClass = log.cacheDrop ? 'dist-cat-cache-warning' : 'dist-cat-cache';
    const cacheValueClass = log.cacheDrop ? 'dist-cat-value cache-warning' : 'dist-cat-value cache';

    html += `<div class="dist-category ${cacheClass}">
      <div class="dist-cat-label">Cache</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-cache" style="width:${barWidth(cachePct)}%"></div></div>
      <div class="${cacheValueClass}">${fmtTokens(cacheTokens)} (${fmtPct(cachePct)}%)${log.cacheDrop ? `<span style="color:#dc2626"> 缓存读取下降 -${fmtTokens(log.cacheDrop.lostTokens)}（${fmtTokens(log.cacheDrop.prevCacheRead)} → ${fmtTokens(log.cacheDrop.currentCacheRead)}）</span>` : ''}</div>
    </div>`;
    html += `<div class="dist-category">
      <div class="dist-cat-label">Input</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-user" style="width:${barWidth(inputPct)}%"></div></div>
      <div class="dist-cat-value blue">${fmtTokens(actualInput)} (${fmtPct(inputPct)}%)</div>
    </div>`;
  }

  // Output 分组
  const showOutput = thinkingTokens > 0 || textTokens > 0;
  if (showOutput) {
    html += '<div class="dist-cat-label" style="margin-top:12px;margin-bottom:8px;color:#666">Output</div>';
  }

  if (thinkingTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">Thinking</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-thinking" style="width:${Math.min(100, thinkingPct * 10)}%"></div></div>
      <div class="dist-cat-value purple">${fmtTokens(thinkingTokens)} (${fmtPct(thinkingPct)}%)</div>
    </div>`;
  }

  if (textTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">Response</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-text" style="width:${Math.min(100, textPct * 10)}%"></div></div>
      <div class="dist-cat-value green">${fmtTokens(textTokens)} (${fmtPct(textPct)}%)</div>
    </div>`;
  }

  if (maxContext) {
    const freeTokens = Math.max(0, maxContext - totalWithCache);
    const freePctActual = pctOf(freeTokens, maxContext);
    html += '<div class="dist-cat-label" style="margin-top:12px;margin-bottom:8px;color:#666">Available</div>';
    html += `<div class="dist-category">
      <div class="dist-cat-label">Free</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-free" style="width:${Math.min(100, freePctActual)}%"></div></div>
      <div class="dist-cat-value">${fmtTokens(freeTokens)} (${fmtPct(freePctActual)}%)</div>
    </div>`;
  }

  html += '</div>';

  // === 实际内容展示 ===
  if (lastUserContent) {
    html += `<div class="dist-categories" style="margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a">
      <div class="dist-category" style="flex-direction:column;align-items:flex-start">
        <div class="dist-cat-label" style="color:#2563eb">User 最后输入</div>
        <div class="message-content" style="font-size:13px;color:#e0e0e0;width:100%;white-space:pre-wrap">${escapeHtml(lastUserContent)}</div>
      </div>`;
    if (thinkingText) {
      html += `<div class="dist-category" style="flex-direction:column;align-items:flex-start;margin-top:8px">
        <div class="dist-cat-label" style="color:#7c3aed">Thinking</div>
        <div class="message-content" style="font-size:13px;color:#e0e0e0;width:100%;white-space:pre-wrap">${escapeHtml(thinkingText)}</div>
      </div>`;
    }
    if (responseText) {
      html += `<div class="dist-category" style="flex-direction:column;align-items:flex-start;margin-top:8px">
        <div class="dist-cat-label" style="color:#059669">Response</div>
        <div class="message-content" style="font-size:13px;color:#e0e0e0;width:100%;white-space:pre-wrap">${escapeHtml(responseText)}</div>
      </div>`;
    }

    html += '</div>';
  }

  // === 本轮工具调用（只显示 response 里的新调用） ===
  const recentToolCalls = [];

  // 只从 response 提取本轮 tool_use
  if (log.response?.toolCalls && log.response.toolCalls.length > 0) {
    recentToolCalls.push(...log.response.toolCalls);
  }

  if (recentToolCalls.length > 0) {
    html += `<div class="dist-category" style="flex-direction:column;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a">
      <div class="dist-cat-label" style="color:#e89d3a;margin-bottom:8px">Tool Calls</div>`;
    // 倒序显示（最新的先显示）
    for (const tc of recentToolCalls.reverse()) {
      const inputStr = typeof tc.input === 'object' ? JSON.stringify(tc.input) : String(tc.input ?? '');
      const inputPreview = inputStr.length > 300 ? inputStr.slice(0, 300) + '…' : inputStr;
      html += `<div class="message-content" style="font-size:12px;color:#e0e0e0;width:100%;white-space:pre-wrap;margin-top:4px"><span style="color:#e89d3a">${escapeHtml(tc.name)}</span>: ${escapeHtml(inputPreview)}</div>`;
    }
    html += '</div>';
  }

  // === 耗时信息（单行） ===
  const metaParts = [`<span class="dist-cat-label">耗时</span><span class="dist-cat-value orange">${log.duration ?? '-'}ms</span>`];

  // SSE帧数
  if (sseStats?.frameCount > 0) {
    metaParts.push(`<span class="dist-meta-sep">·</span><span class="dist-cat-label">SSE帧数</span><span class="dist-cat-value">${sseStats.frameCount}</span>`);
  }

  // 消息长度
  const msgCount = messages.length;
  if (msgCount > 0) {
    metaParts.push(`<span class="dist-meta-sep">·</span><span class="dist-cat-label">消息长度</span><span class="dist-cat-value">${msgCount}</span>`);
  }

  // 工具调用次数（统计 messages 中 assistant 的 tool_use）
  let toolCallCount = 0;
  messages.forEach(m => {
    if (m.role === 'assistant' && Array.isArray(m.content)) {
      toolCallCount += m.content.filter(b => b.type === 'tool_use').length;
    }
  });
  if (toolCallCount > 0) {
    metaParts.push(`<span class="dist-meta-sep">·</span><span class="dist-cat-label">工具调用</span><span class="dist-cat-value">${toolCallCount}</span>`);
  }

  // Token速率 (token/s)
  const outTokens = usage?.output_tokens || 0;
  const durationSec = (log.duration || 0) / 1000;
  if (outTokens > 0 && durationSec > 0) {
    const rate = Math.round(outTokens / durationSec);
    metaParts.push(`<span class="dist-meta-sep">·</span><span class="dist-cat-label">Token速率</span><span class="dist-cat-value green">${rate} token/s</span>`);
  }

  html += `<div class="dist-categories" style="margin-top:12px;padding-top:8px;border-top:1px solid #2a2a2a">
    <div class="dist-meta-line">${metaParts.join('')}</div>
  </div>`;

  html += '</div>';
  return html;
}

// 渲染 content：字符串或 content block 数组。消息及其内容块均按原始数据完整展示。
function renderRequestContent(content) {
  if (!content) return '<div class="message-content">(空)</div>';
  if (typeof content === 'string') {
    return `<div class="message-content">${escapeHtml(content)}</div>`;
  }
  if (!Array.isArray(content)) {
    return `<div class="message-content">${escapeHtml(getText(content))}</div>`;
  }
  return content.map((block, index) => {
    const type = block.type || 'block';
    const text = block.text ?? block.thinking ?? block.input ?? block.content ?? '';
    return `<div class="message-block" style="margin-bottom:6px">
      <div class="message-role"><span>${escapeHtml(type)}</span></div>
      <div class="message-content">${escapeHtml(getText(text))}</div>
    </div>`;
  }).join('');
}

function renderFriendlyRequestHeader(request) {
  if (!request) return '';
  let html = '<div class="friendly-section"><div class="friendly-title">请求详情</div>';

  if (request.model) {
    html += `<div class="friendly-row"><div class="friendly-label">模型</div><div class="friendly-value blue">${escapeHtml(request.model)}</div></div>`;
  }

  const scalarFields = [
    ['max_tokens', '最大 Token'],
    ['temperature', '温度'],
    ['stream', '流式'],
    ['tool_choice', '工具选择'],
  ];
  for (const [key, label] of scalarFields) {
    if (request[key] !== undefined && request[key] !== null) {
      const display = typeof request[key] === 'object' ? JSON.stringify(request[key]) : String(request[key]);
      html += `<div class="friendly-row"><div class="friendly-label">${label}</div><div class="friendly-value">${escapeHtml(display)}</div></div>`;
    }
  }

  if (request.tools && request.tools.length > 0) {
    const toolNames = request.tools.map((tool) => tool.name || tool.type || '?').join(', ');
    html += `<div class="friendly-row"><div class="friendly-label">工具</div><div class="friendly-value">${request.tools.length} 个 · ${escapeHtml(toolNames)}</div></div>`;
  }

  const messageCount = Array.isArray(request.messages) ? request.messages.length : 0;
  if (messageCount > 0) html += `<div class="friendly-row"><div class="friendly-label">消息数</div><div class="friendly-value">${messageCount} 条</div></div>`;
  return `${html}</div>`;
}

function renderFriendlyRequestMessages(messages, start, count) {
  if (!Array.isArray(messages) || start >= messages.length) return '';
  let html = '';
  const end = Math.min(start + count, messages.length);
  for (let offset = start; offset < end; offset++) {
    const actualIdx = messages.length - offset;
    const msg = messages[actualIdx - 1];
    const role = msg?.role || 'unknown';
    html += `<div class="message-block">
      <div class="message-role"><span>${escapeHtml(role)}</span><span style="float:right;color:#555">#${actualIdx}</span></div>
      ${renderRequestContent(msg?.content)}
    </div>`;
  }
  return html;
}

function renderFriendlyRequest(request) {
  const messages = Array.isArray(request?.messages) ? request.messages : [];
  return `${renderFriendlyRequestHeader(request)}${renderFriendlyRequestMessages(messages, 0, messages.length)}`;
}

function renderFriendlyResponse(response) {
  if (!response) return '';
  let html = '<div class="friendly-section"><div class="friendly-title">响应详情</div>';

  const sseStats = parseSseResponse(response);

  if (sseStats && response.format === 'sse') {
    // SSE 格式响应
    html += `<div class="friendly-row"><div class="friendly-label">格式</div><div class="friendly-value">SSE 流式</div></div>`;
    html += `<div class="friendly-row"><div class="friendly-label">帧数</div><div class="friendly-value">${sseStats.frameCount}</div></div>`;

    if (response.message) {
      html += `<div class="friendly-row"><div class="friendly-label">消息ID</div><div class="friendly-value">${response.message.id || '-'}</div></div>`;
      if (response.message.model) {
        html += `<div class="friendly-row"><div class="friendly-label">实际模型</div><div class="friendly-value blue">${response.message.model}</div></div>`;
      }
    }

    if (sseStats.thinkingLen > 0) {
      const thinking = getText(response.thinking);
      html += `<div class="thinking-block">
        <div class="thinking-label">思考过程 (${thinking.length} 字)</div>
        <div class="message-content">${escapeHtml(thinking)}</div>
      </div>`;
    }

    if (sseStats.textLen > 0) {
      const text = getText(response.assistantText);
      html += `<div class="response-block">
        <div class="response-label">回复内容 (${text.length} 字)</div>
        <div class="message-content">${escapeHtml(text)}</div>
      </div>`;
    }

    if (response.stopReason) {
      html += `<div class="friendly-row"><div class="friendly-label">停止原因</div><div class="friendly-value orange">${response.stopReason}</div></div>`;
    }

    if (sseStats.usage) {
      const u = sseStats.usage;
      const parts = [];
      if (u.input_tokens !== undefined) parts.push(`输入: ${formatDetailedTokenMetric(u.input_tokens)}`);
      if (u.output_tokens !== undefined) parts.push(`输出: ${formatDetailedTokenMetric(u.output_tokens)}`);
      if (u.cache_read_input_tokens !== undefined) parts.push(`缓存: ${formatDetailedTokenMetric(u.cache_read_input_tokens)}`);
      if (u.cache_creation_input_tokens !== undefined) parts.push(`缓存创建: ${formatDetailedTokenMetric(u.cache_creation_input_tokens)}`);
      html += `<div class="friendly-row"><div class="friendly-label">Token 使用</div><div class="friendly-value highlight" style="word-break:break-all">${parts.join(' · ')}</div></div>`;
    }

  } else if (response.choices) {
    // OpenAI 格式
    html += `<div class="friendly-row"><div class="friendly-label">格式</div><div class="friendly-value">OpenAI</div></div>`;
    for (const choice of response.choices) {
      const content = getText(choice.message?.content || choice.delta?.content);
      html += `<div class="response-block">
        <div class="response-label">回复</div>
        <div class="message-content">${escapeHtml(content)}</div>
      </div>`;
    }

  } else if (response.content) {
    // Anthropic 格式
    html += `<div class="friendly-row"><div class="friendly-label">格式</div><div class="friendly-value">Anthropic</div></div>`;
    for (const block of response.content) {
      if (block.type === 'text') {
        html += `<div class="response-block">
          <div class="response-label">文本回复</div>
          <div class="message-content">${escapeHtml(getText(block.text))}</div>
        </div>`;
      } else if (block.type === 'thinking') {
        html += `<div class="thinking-block">
          <div class="thinking-label">思考过程</div>
          <div class="message-content">${escapeHtml(getText(block.thinking))}</div>
        </div>`;
      }
    }

  } else if (response.models) {
    // 模型列表
    html += `<div class="friendly-row"><div class="friendly-label">格式</div><div class="friendly-value">模型列表</div></div>`;
    html += `<div class="friendly-row"><div class="friendly-label">模型数</div><div class="friendly-value highlight">${response.models.length}</div></div>`;
    const modelNames = response.models.map(m => m.name || m.id || m).join(', ');
    html += `<div class="friendly-row"><div class="friendly-label">模型</div><div class="friendly-value">${escapeHtml(modelNames)}</div></div>`;

  } else {
    // 其他格式 - 显示关键字段
    const keys = Object.keys(response).slice(0, 5);
    for (const key of keys) {
      const val = response[key];
      const display = typeof val === 'object' ? JSON.stringify(val) : String(val);
      html += `<div class="friendly-row"><div class="friendly-label">${key}</div><div class="friendly-value">${escapeHtml(display)}</div></div>`;
    }
  }

  html += '</div>';
  return html;
}

function renderFriendlyToolStats(log) {
  const toolCallStats = {};
  const request = log.request;
  if (request && request.messages && Array.isArray(request.messages)) {
    const messages = request.messages;
    const start = Math.max(0, messages.length - DETAIL_TOOL_STATS_MESSAGES);
    for (let messageIndex = start; messageIndex < messages.length; messageIndex++) {
      const message = messages[messageIndex];
      if (message.role !== 'assistant' || !Array.isArray(message.content)) continue;
      for (let blockIndex = 0; blockIndex < Math.min(message.content.length, DETAIL_TOOL_STATS_BLOCKS); blockIndex++) {
        const block = message.content[blockIndex];
        if (block.type !== 'tool_use') continue;
        const name = block.name || 'unknown';
        toolCallStats[name] = (toolCallStats[name] || 0) + 1;
      }
    }
  }
  if (log.response?.toolCalls && log.response.toolCalls.length > 0) {
    log.response.toolCalls.forEach(tc => {
      const name = tc.name || 'unknown';
      toolCallStats[name] = (toolCallStats[name] || 0) + 1;
    });
  }
  const toolNames = Object.keys(toolCallStats);
  if (toolNames.length === 0) return '';
  const totalCount = toolNames.reduce((sum, name) => sum + toolCallStats[name], 0);
  const statsStr = toolNames.map(name => `${name} x${toolCallStats[name]}`).join(', ');
  return `<div class="friendly-section"><div class="friendly-title">工具调用统计</div>
    <div class="friendly-row"><div class="friendly-label">总次数</div><div class="friendly-value orange">${totalCount}</div></div>
    <div class="friendly-row"><div class="friendly-label">分布</div><div class="friendly-value">${escapeHtml(statsStr)}</div></div>
  </div>`;
}
