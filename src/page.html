<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mock-ollama</title>
<script src="https://unpkg.com/gpt-tokenizer/dist/cl100k_base.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "Helvetica Neue", sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
  min-height: 100vh;
}

/* 顶部栏 */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 24px;
  background: #1a1a1a;
  border-bottom: 1px solid #2a2a2a;
  overflow: visible;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
}

.logo-container {
  position: relative;
  display: inline-block;
}

.logo {
  font-size: 24px;
  font-weight: 700;
  color: #e5e7eb;
  letter-spacing: -0.5px;
  position: relative;
  display: inline-block;
  padding: 4px 12px;
  transition: color 2s ease-out, text-shadow 2s ease-out;
  text-shadow:
    1px 1px 0 #333,
    2px 2px 0 #2a2a2a,
    3px 3px 0 #1a1a1a;
}

/* Logo 点亮效果 */
.logo.illuminated {
  color: #ffffff;
  text-shadow:
    0 0 10px rgba(255,255,255,0.8),
    0 0 20px rgba(255,255,255,0.5),
    0 0 40px rgba(255,255,255,0.3),
    1px 1px 0 #333,
    2px 2px 0 #2a2a2a,
    3px 3px 0 #1a1a1a;
  transition: color 0.05s ease-out, text-shadow 0.05s ease-out;
}

/* SVG 闪电容器 */
.lightning-svg {
  position: absolute;
  top: 50%;
  left: calc(50% - 40px);
  transform: translate(-50%, -60%) rotate(10deg);
  width: 120%;
  height: 200%;
  pointer-events: none;
  z-index: 10;
}

/* 主闪电路径 */
.lightning-main {
  fill: none;
  stroke: url(#lightningGradient);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
}

/* 闪电分叉 */
.lightning-branch {
  fill: none;
  stroke: url(#branchGradient);
  stroke-width: 2;
  stroke-linecap: round;
  opacity: 0;
}

/* 闪电动画序列 */
@keyframes strikeSequence {
  0%, 100% { opacity: 0; }
  /* 第一次微闪 ~700ms */
  14% { opacity: 0.6; }
  15% { opacity: 0; }
  /* 第二次主闪 ~850ms */
  17% { opacity: 1; }
  19% { opacity: 0.9; }
  21% { opacity: 1; }
  /* 渐暗 */
  26% { opacity: 0.4; }
  /* 熄灭 */
  32%, 100% { opacity: 0; }
}

.lightning-main.active,
.lightning-branch.active {
  animation: strikeSequence 5s ease-out infinite;
}

/* 字体电流效果 - SVG text 描边 */
.logo-current-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 20;
  overflow: visible;
}

.logo-current-text {
  fill: transparent;
  stroke: #ffffff;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
  stroke-dasharray: 4 16;
  stroke-dashoffset: 0;
  opacity: 0;
  filter: drop-shadow(0 0 3px rgba(255,255,255,0.9));
}

.logo-current-text.active {
  opacity: 1;
  animation: flowTextCurrent 0.55s linear forwards;
}

@keyframes flowTextCurrent {
  0% {
    stroke-dashoffset: 0;
    opacity: 1;
  }
  70% {
    opacity: 0.8;
  }
  100% {
    stroke-dashoffset: -80;
    opacity: 0;
  }
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: #2a2a2a;
  border-radius: 8px;
  font-size: 13px;
  color: #888;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #059669;
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.header-controls {
  display: flex;
  gap: 8px;
}

.btn {
  padding: 8px 16px;
  border: 1px solid #333;
  border-radius: 8px;
  background: transparent;
  color: #888;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.btn:hover { border-color: #555; color: #fff; }

/* SVG 内嵌实现精确的旋转边框动画 */
.btn.active-snake {
  position: relative;
  border: 1px solid #3a3a3a;
  background: #1a1a1a;
  color: #fff;
  overflow: visible;
}
.snake-border-svg {
  position: absolute;
  inset: -2px;
  width: calc(100% + 4px);
  height: calc(100% + 4px);
  pointer-events: none;
  filter: drop-shadow(0 0 3px rgba(255,255,255,0.9))
          drop-shadow(0 0 6px rgba(255,255,255,0.5))
          drop-shadow(0 0 12px rgba(255,255,255,0.3));
}
.snake-border-svg path {
  fill: none;
  stroke: rgba(255,255,255,0.95);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 40 145 40 145;
  animation: snake-run 4s linear infinite;
}
@keyframes snake-run { to { stroke-dashoffset: -370; } }

/* 主内容区 */
.main {
  padding: 24px;
  max-width: 1200px;
  margin: 0 auto;
}

.section-label {
  font-size: 13px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

/* 日志卡片 */
.log-card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s;
}

.log-card:hover { border-color: #3a3a3a; }
.log-card.expanded { border-color: #059669; }

.log-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 16px;
  line-height: 1;
}

.log-time {
  font-size: 12px;
  color: #666;
  font-family: 'SF Mono', monospace;
  white-space: nowrap;
  line-height: 1;
}
.log-time-date { color: #666; }
.log-time-clock { color: #666; transition: color 0.3s ease; }
.log-card:hover .log-time-clock { color: #e0e0e0; }

.log-method {
  font-size: 13px;
  font-weight: 600;
  color: #059669;
  width: 50px;
  line-height: 1;
  margin-left: 8px;
  text-align: center;
}

.log-method.POST { color: #2563eb; }

.log-path {
  font-size: 13px;
  color: #e0e0e0;
  font-family: 'SF Mono', monospace;
  line-height: 1;
}

.log-status {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-family: 'SF Mono', monospace;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  min-height: 18px;
  margin-left: 16px;
}

.log-status.success { background: rgba(5,150,105,0.2); color: #059669; }
.log-status.error { background: rgba(220,38,38,0.2); color: #dc2626; }

.log-expand-btn {
  margin-left: auto;
  padding: 4px 10px;
  border: 1px solid #333;
  border-radius: 6px;
  background: transparent;
  color: #888;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.log-expand-btn:hover {
  border-color: #2563eb;
  color: #2563eb;
}

.log-card.expanded .log-expand-btn {
  background: rgba(37,99,235,0.1);
  border-color: #2563eb;
  color: #2563eb;
}

/* 横向上下文分布条 - 类似 /context */
.dist-bar-wrap {
  padding: 12px 16px;
  background: #0f0f0f;
}

.dist-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.dist-model {
  font-size: 14px;
  color: #888;
}

.dist-total {
  font-size: 14px;
  color: #888;
  font-family: 'SF Mono', monospace;
}

.dist-bar-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dist-bar {
  display: flex;
  height: 24px;
  border-radius: 4px;
  overflow: hidden;
  flex-wrap: nowrap;
}

.dist-seg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  color: #fff;
  min-width: 20px;
  transition: all 0.3s;
}

/* 请求段颜色 */
.seg-user        { background: #2563eb; }
.seg-assistant   { background: #7c3aed; }
.seg-system      { background: #9ca3af; }

/* 响应段颜色 */
.seg-thinking    { background: #7c3aed; }
.seg-text        { background: #059669; }
.seg-free        { background: #333; }
.seg-error       { background: #dc2626; }
.seg-cache       { background: #0891b2; }

/* Cache 样式 */
.dist-cat-cache { background: rgba(8,145,178,0.1); border-radius: 6px; padding: 4px 0; }
.dist-cat-cache-warning { background: rgba(220,38,38,0.15); border-radius: 6px; padding: 4px 0; border: 1px solid rgba(220,38,38,0.3); }
.dist-cat-value.cache { color: #0891b2; }
.dist-cat-value.cache-warning { color: #dc2626; }

/* 分类列表 - 类似 /context */
.dist-categories {
  margin-top: 12px;
}

.dist-category {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 13px;
}

.dist-cat-bar {
  display: flex;
  height: 16px;
  width: 200px;
  border-radius: 3px;
  overflow: hidden;
  background: #1a1a1a;
}

.dist-cat-fill {
  height: 100%;
  border-radius: 3px;
}

.dist-cat-label {
  color: #888;
  min-width: 100px;
}

.dist-cat-value {
  color: #666;
  font-family: 'SF Mono', monospace;
}

.dist-cat-value.highlight { color: #e0e0e0; }
.dist-cat-value.green { color: #059669; }
.dist-cat-value.orange { color: #d97706; }
.dist-cat-value.blue { color: #2563eb; }
.dist-cat-value.purple { color: #7c3aed; }

.dist-meta-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  flex-wrap: wrap;
}

.dist-meta-line .dist-cat-label {
  min-width: auto;
}

.dist-meta-line .dist-meta-sep {
  color: #444;
  margin: 0 4px;
}

/* 详情展开区 */
.log-detail {
  display: none;
  padding: 0 16px 16px;
  border-top: 1px solid #2a2a2a;
}

.log-card.expanded .log-detail { display: block; }

/* 视图切换 */
.view-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.view-btn {
  padding: 4px 12px;
  border: 1px solid #333;
  border-radius: 6px;
  background: transparent;
  color: #666;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.view-btn:hover { border-color: #555; color: #888; }
.view-btn.active { border-color: #2563eb; color: #2563eb; background: rgba(37,99,235,0.1); }

.detail-section {
  margin-top: 12px;
}

.detail-label {
  font-size: 11px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.detail-json {
  font-family: 'SF Mono', Consolas, monospace;
  font-size: 12px;
  line-height: 1.5;
  color: #e0e0e0;
  background: #0f0f0f;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #2a2a2a;
  overflow-x: hidden;
  max-height: 300px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* 请求 JSON 更长 */
.detail-json.request-json {
  max-height: 500px;
}

.detail-error {
  padding: 12px;
  background: rgba(220,38,38,0.1);
  border-radius: 8px;
  color: #dc2626;
  font-size: 13px;
}

/* 友好视图 */
.friendly-view {
  font-size: 14px;
  line-height: 1.8;
}

.friendly-section {
  margin-bottom: 16px;
}

.friendly-title {
  font-size: 13px;
  color: #888;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #2a2a2a;
}

.friendly-row {
  display: flex;
  gap: 8px;
  margin-bottom: 6px;
}

.friendly-label {
  color: #666;
  min-width: 80px;
}

.friendly-value {
  color: #e0e0e0;
}

.friendly-value.highlight { color: #059669; }
.friendly-value.orange { color: #d97706; }
.friendly-value.blue { color: #2563eb; }
.friendly-value.purple { color: #7c3aed; }

.message-block {
  background: #0f0f0f;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  border: 1px solid #2a2a2a;
}

.message-role {
  font-size: 11px;
  color: #666;
  margin-bottom: 4px;
}

.message-content {
  font-size: 13px;
  color: #e0e0e0;
  white-space: pre-wrap;
  word-break: break-word;
}

.thinking-block {
  background: rgba(124,58,237,0.1);
  border: 1px solid rgba(124,58,237,0.3);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
}

.thinking-label {
  font-size: 11px;
  color: #7c3aed;
  margin-bottom: 4px;
}

.response-block {
  background: rgba(5,150,105,0.1);
  border: 1px solid rgba(5,150,105,0.3);
  border-radius: 8px;
  padding: 10px 12px;
}

.response-label {
  font-size: 11px;
  color: #059669;
  margin-bottom: 4px;
}

/* Legend */
.legend {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  padding: 12px 16px;
  background: #1a1a1a;
  border-radius: 8px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #888;
}

.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

/* 空状态 */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: #555;
}

.empty-text { font-size: 14px; color: #555; }

/* 滚动条 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #0f0f0f; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

/* 右侧滑出面板 */
.slide-panel {
  position: fixed;
  top: 0;
  right: -600px;
  width: 600px;
  height: 100vh;
  background: #1a1a1a;
  border-left: 1px solid #2a2a2a;
  z-index: 1000;
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
}

.slide-panel.open { right: 0; }
body.panel-open { overflow: hidden; }

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid #2a2a2a;
}

.panel-title {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
}

.panel-close {
  width: 32px;
  height: 32px;
  border: 1px solid #333;
  border-radius: 8px;
  background: transparent;
  color: #888;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
}

.panel-close:hover { border-color: #555; color: #fff; }

.panel-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
}

.panel-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.5);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s;
}

.panel-overlay.open { opacity: 1; visibility: visible; }

/* Diff 对比视图 */
.diff-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #0f0f0f;
  display: none;
  z-index: 1001;
  flex-direction: column;
  overscroll-behavior: contain;
}
.diff-container.open { display: flex; }

.diff-header {
  height: 48px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 16px;
  background: #1a1a1a;
  border-bottom: 1px solid #2a2a2a;
  position: relative;
}

.diff-header-left {
  text-align: center;
  font-size: 13px;
  color: #888;
}

.diff-header-center {
  font-size: 14px;
  color: #fff;
  font-weight: 600;
}

.diff-header-right {
  text-align: center;
  font-size: 13px;
  color: #888;
  position: relative;
}

.diff-close-btn {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  padding: 6px 12px;
  border: 1px solid #333;
  border-radius: 6px;
  background: transparent;
  color: #888;
  font-size: 13px;
  cursor: pointer;
}
.diff-close-btn:hover { border-color: #555; color: #fff; }

.diff-body {
  flex: 1;
  display: flex;
  position: relative;
  overflow: hidden;
}

/* Minimap 在中间 */
.diff-minimap {
  width: 60px;
  background: #1a1a1a;
  border-left: 1px solid #2a2a2a;
  border-right: 1px solid #2a2a2a;
  position: relative;
  overflow: hidden;
  cursor: grab;
}

.diff-minimap:active { cursor: grabbing; }

.diff-minimap-items {
  position: absolute;
  top: 8px;
  left: 6px;
  right: 6px;
  bottom: 8px;
}

.diff-minimap-item {
  position: absolute;
  left: 0;
  right: 0;
  min-height: 4px;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
}

.diff-minimap-same { background: rgba(60,60,60,0.4); }
.diff-minimap-diff { background: #ef4444; }
.diff-minimap-added { background: #10b981; }
.diff-minimap-removed { background: #ef4444; }

.diff-minimap-item:hover { filter: brightness(1.5); }

/* 视口指示器 */
.diff-minimap-viewport {
  position: absolute;
  left: 3px;
  right: 3px;
  height: 24px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 3px;
  pointer-events: none;
  transition: top 0.05s;
}

/* 主内容区域 */
.diff-main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.diff-panel {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
  scrollbar-width: none;
}
.diff-panel::-webkit-scrollbar { display: none; }

.diff-panel-left {
  background: #1a1a1a;
}

.diff-panel-right {
  background: #1a1a1a;
}

/* 删除 gutter */
.diff-gutter { display: none; }

/* 消息样式 */
.diff-message {
  padding: 12px 16px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #2a2a2a;
}

.diff-message-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.diff-message-role {
  font-size: 12px;
  color: #666;
}

.diff-message-index {
  font-size: 12px;
  color: #555;
}

.diff-message-content {
  font-size: 14px;
  color: #e0e0e0;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.6;
}

.diff-same { background: transparent; }
.diff-diff { background: rgba(220,38,38,0.15); border-color: rgba(220,38,38,0.4); }
.diff-added { background: rgba(5,150,105,0.15); border-color: rgba(5,150,105,0.4); }
.diff-removed { background: rgba(220,38,38,0.15); border-color: rgba(220,38,38,0.4); }

.diff-diff .diff-message-role { color: #dc2626; }
.diff-added .diff-message-role { color: #059669; }
.diff-removed .diff-message-role { color: #dc2626; }

/* Token 级别差异 */
.diff-token { display: inline; }
.diff-token-same { }
.diff-token-added { background: rgba(5,150,105,0.3); color: #059669; }
.diff-token-removed { background: rgba(220,38,38,0.35); color: #dc2626; }
.diff-token-diff { background: rgba(220,38,38,0.5); color: #fff; }

/* 消息标题 */
.diff-messages-title {
  font-size: 12px;
  color: #666;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #2a2a2a;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-container">
      <!-- SVG 闪电 -->
      <svg class="lightning-svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- 主闪电渐变 -->
          <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#cffafe;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.9" />
          </linearGradient>

          <!-- 分叉渐变 -->
          <linearGradient id="branchGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#cffafe;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:0.6" />
          </linearGradient>

          <!-- 发光滤镜 -->
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- 主闪电 -->
        <path class="lightning-main" id="lightningMain"
              d="M 50,100 L 80,95 L 110,105 L 140,90 L 170,100 L 200,85 L 230,95 L 260,80 L 290,90 L 320,75 L 350,85"/>

        <!-- 分叉 1 - 右上 -->
        <path class="lightning-branch" id="branch1"
              d="M 170,100 L 185,85 L 200,70 L 215,60"/>

        <!-- 分叉 2 - 右下 -->
        <path class="lightning-branch" id="branch2"
              d="M 230,95 L 245,110 L 260,125 L 275,135" style="animation-delay: 0.05s"/>

        <!-- 分叉 3 - 右上小分叉 -->
        <path class="lightning-branch" id="branch3"
              d="M 290,90 L 305,78 L 315,68" style="animation-delay: 0.1s"/>
      </svg>

      <!-- 字体电流层 -->
      <svg class="logo-current-svg" id="logoCurrentSvg">
        <text class="logo-current-text" id="logoCurrent"
              dominant-baseline="central"
              text-anchor="middle">mock-ollama</text>
      </svg>

      <!-- Logo -->
      <div class="logo" id="logo">mock-ollama</div>
    </div>
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">已连接</span>
    </div>
  </div>
  <div class="header-controls">
    <button class="btn active-snake" id="autoRefreshBtn" onclick="toggleAutoRefresh()">
      <svg class="snake-border-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M 14.5,0.5 L 85.5,0.5 A 14,14 0 0,1 99.5,14 L 99.5,85.5 A 14,14 0 0,1 85.5,99.5 L 14.5,99.5 A 14,14 0 0,1 0.5,85.5 L 0.5,14 A 14,14 0 0,1 14.5,0.5"/>
      </svg>
      实时推送
    </button>
    <button class="btn" id="clearBtn" onclick="confirmClear()">清空</button>
  </div>
</div>

<!-- Diff 对比视图 -->
<div class="diff-container" id="diffContainer">
  <div class="diff-header">
    <div class="diff-header-left" id="diffTitleLeft">上一条请求</div>
    <div class="diff-header-center">对比视图</div>
    <div class="diff-header-right">
      <span id="diffTitleRight">当前请求</span>
      <button class="diff-close-btn" onclick="closeDiffView()">关闭</button>
    </div>
  </div>
  <div class="diff-body">
    <div class="diff-panel diff-panel-left" id="diffPanelLeft"></div>
    <div class="diff-minimap" id="diffMinimap">
      <div class="diff-minimap-items" id="diffMinimapItems"></div>
      <div class="diff-minimap-viewport" id="diffMinimapViewport"></div>
    </div>
    <div class="diff-panel diff-panel-right" id="diffPanelRight"></div>
  </div>
</div>

<div class="main">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#9ca3af"></div>System</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7c3aed"></div>Assistant</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2563eb"></div>User</div>
    <div class="legend-item"><div class="legend-dot" style="background:#059669"></div>Response</div>
    <div class="legend-item"><div class="legend-dot" style="background:#333"></div>Free</div>
  </div>

  <div class="section-label">请求日志</div>

  <div id="logContainer">
    <div class="empty-state">
      <div class="empty-text">等待请求...</div>
    </div>
  </div>
</div>

<!-- 右侧滑出面板 -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
<div class="slide-panel" id="slidePanel">
  <div class="panel-header">
    <div class="panel-title" id="panelTitle">详情</div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="extractDiffBtn" onclick="extractDiffLines()" style="padding:4px 10px;font-size:12px">提取差异</button>
      <button class="btn" id="diffBtn" onclick="openDiffView()" style="padding:4px 10px;font-size:12px">对比缓存</button>
      <button class="panel-close" onclick="closePanel()">×</button>
    </div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script>
// Lightning animation for logo
(function() {
  // 对齐 SVG 文字到 logo div
  function alignCurrentText() {
    const logo = document.getElementById('logo');
    const svg = document.getElementById('logoCurrentSvg');
    const text = document.getElementById('logoCurrent');
    if (!logo || !svg || !text) return;
    const w = logo.offsetWidth;
    const h = logo.offsetHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    text.setAttribute('x', w / 2);
    text.setAttribute('y', h / 2);
  }

  // 点亮 logo 和文字电流
  function illuminateLogo() {
    const logo = document.getElementById('logo');
    const textCurrent = document.getElementById('logoCurrent');
    if (!logo || !textCurrent) return;

    logo.classList.add('illuminated');
    textCurrent.classList.add('active');

    // 移除点亮效果
    setTimeout(() => {
      logo.classList.remove('illuminated');
    }, 300);

    // 重置文字电流
    setTimeout(() => {
      textCurrent.classList.remove('active');
    }, 650);
  }

  // 启动闪电动画（只执行一次）
  function startLightning() {
    const main = document.getElementById('lightningMain');
    const branches = document.querySelectorAll('.lightning-branch');
    if (!main) return;

    // 只在第一次添加 active 类，之后 CSS 动画自然循环
    main.classList.add('active');
    branches.forEach(b => b.classList.add('active'));

    // 监听 CSS 动画每次循环开始
    main.addEventListener('animationiteration', () => {
      // CSS 动画周期开始，在主闪时刻(850ms)点亮
      setTimeout(illuminateLogo, 850);
    });

    // 第一次点亮（初始延迟 + 850ms）
    setTimeout(illuminateLogo, 500 + 850);
  }

  // 初始化
  window.addEventListener('load', () => {
    alignCurrentText();
    setTimeout(startLightning, 500);
  });
})();

// 拆分日期和时间，只让时间部分 hover 高亮
function splitTime(time) {
  if (!time) return '';
  const parts = time.split(' ');
  if (parts.length === 2) {
    return `<span class="log-time-date">${parts[0]}</span> <span class="log-time-clock">${parts[1]}</span>`;
  }
  return time;
}

let autoRefreshEnabled = true;
let sseConnection = null;
let expandedLogId = null;
let viewModes = {}; // 存储每条日志的视图模式: 'friendly' 或 'raw'
let appContextLength = 200000;

async function loadAppInfo() {
  try {
    const res = await fetch('/api/info');
    const info = await res.json();
    appContextLength = info.contextLength ?? 200000;
  } catch (err) {
    console.warn('加载服务配置失败:', err);
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadAppInfo();
  fetchLogs(); // 初始加载
  startSseConnection();

  // ESC 键关闭侧边栏和对比视图
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      // 先检查对比视图
      const diffContainer = document.getElementById('diffContainer');
      if (diffContainer.classList.contains('open')) {
        closeDiffView();
        return;
      }
      // 再检查侧边栏
      const slidePanel = document.getElementById('slidePanel');
      if (slidePanel.classList.contains('open')) {
        closePanel();
      }
    }
  });
});

function startSseConnection() {
  if (sseConnection) return;

  sseConnection = new EventSource('/api/logs/stream');
  updateStatus(true);

  sseConnection.addEventListener('new-log', (e) => {
    try {
      const newLog = JSON.parse(e.data);
      // 追加到当前日志列表
      if (!window.currentLogs) window.currentLogs = [];
      window.currentLogs.push(newLog);

      // 增量追加到页面（不重新渲染已有内容）
      const container = document.getElementById('logContainer');
      if (container.querySelector('.empty-state')) {
        // 如果是空状态，先清除
        container.innerHTML = '';
      }

      // 渲染单个新卡片（插入到最前面）
      const cardHtml = renderSingleLogCard(newLog);
      container.insertAdjacentHTML('afterbegin', cardHtml);

      // 延迟渲染分布条（单个日志直接用 requestIdleCallback）
      const newCard = container.querySelector(`.log-card[data-log-id="${newLog.id}"]`);
      if (newCard && newLog.method === 'POST') {
        const placeholder = newCard.querySelector('.dist-bar-placeholder');
        if (placeholder) {
          const renderBar = () => {
            try {
              placeholder.outerHTML = `<div class="dist-bar-wrap">${buildDistBar(newLog)}</div>`;
            } catch (err) {
              console.error('buildDistBar error:', err);
            }
          };
          if (typeof requestIdleCallback !== 'undefined') {
            requestIdleCallback(renderBar, { timeout: 100 });
          } else {
            setTimeout(renderBar, 50);
          }
        }
      }

      // 限制显示数量（移除超出的旧卡片）
      if (window.currentLogs.length > 50) {
        window.currentLogs = window.currentLogs.slice(-50);
        const cards = container.querySelectorAll('.log-card');
        if (cards.length > 50) {
          for (let i = 50; i < cards.length; i++) {
            cards[i].remove();
          }
        }
      }
    } catch (err) {
      console.error('SSE new-log parse error:', err);
    }
  });

  sseConnection.addEventListener('clear-logs', () => {
    window.currentLogs = [];
    expandedLogId = null;
    viewModes = {};
    renderLogs([]);
  });

  sseConnection.onerror = () => {
    console.log('SSE connection error, will reconnect');
    updateStatus(false, '重连中');
    sseConnection.close();
    sseConnection = null;
    // 5秒后重连
    setTimeout(() => {
      if (autoRefreshEnabled) startSseConnection();
    }, 5000);
  };

  updateAutoRefreshBtn();
}

function stopSseConnection() {
  if (sseConnection) {
    sseConnection.close();
    sseConnection = null;
  }
  updateStatus(false);
}

function updateStatus(connected, text = null) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusText');
  if (connected) {
    dot.style.background = '#059669';
    label.textContent = text || '已连接';
  } else {
    dot.style.background = '#dc2626';
    label.textContent = text || '已断开';
  }
}

function updateAutoRefreshBtn() {
  const btn = document.getElementById('autoRefreshBtn');
  if (autoRefreshEnabled) {
    btn.className = 'btn active-snake';
    btn.innerHTML = `<svg class="snake-border-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M 14.5,0.5 L 85.5,0.5 A 14,14 0 0,1 99.5,14 L 99.5,85.5 A 14,14 0 0,1 85.5,99.5 L 14.5,99.5 A 14,14 0 0,1 0.5,85.5 L 0.5,14 A 14,14 0 0,1 14.5,0.5"/></svg>实时推送`;
  } else {
    btn.className = 'btn';
    btn.textContent = '开始推送';
  }
}

function toggleAutoRefresh() {
  autoRefreshEnabled = !autoRefreshEnabled;
  if (autoRefreshEnabled) {
    startSseConnection();
    // 只在没有日志时才获取（避免重新渲染已有内容）
    if (!window.currentLogs || window.currentLogs.length === 0) {
      fetchLogs();
    }
  } else {
    stopSseConnection();
  }
  updateAutoRefreshBtn();
}

async function fetchLogs() {
  try {
    const res = await fetch('/api/logs?limit=50');
    if (res.ok) {
      const logs = await res.json();
      renderLogs(logs);
    }
  } catch (e) {
    console.error('fetchLogs error:', e);
  }
}

function confirmClear() {
  if (confirm('确认清空所有日志？此操作不可撤销')) {
    clearLogs();
  }
}

async function clearLogs() {
  try {
    await fetch('/api/logs', { method: 'DELETE' });
    expandedLogId = null;
    viewModes = {};
    fetchLogs();
  } catch (e) {}
}

function toggleViewMode(logId, mode) {
  viewModes[logId] = mode;
  // 更新右侧面板内容
  const panelBody = document.getElementById('panelBody');
  if (panelBody) {
    const log = window.currentLogs?.find(l => l.id === logId);
    if (log) {
      panelBody.innerHTML = renderDetailContent(log);
    }
  }
}

function parseSseResponse(response) {
  if (!response || typeof response !== 'object') return null;
  const stats = { textLen: 0, thinkingLen: 0, frameCount: 0, usage: null };
  if (response.format === 'sse') {
    stats.frameCount = response.frameCount || 0;
    stats.textLen = response.assistantText?.length || 0;
    stats.thinkingLen = response.thinking?.length || 0;
    if (response.usage) stats.usage = response.usage;
  }
  return stats;
}

// 获取完整文本
function getText(text) {
  if (!text) return '';
  return typeof text === 'string' ? text : JSON.stringify(text);
}

function buildDistBar(log) {
  if (log.error) {
    return `<div class="dist-bar-container">
      <div class="dist-category">
        <div class="dist-cat-label" style="color:#dc2626">错误</div>
        <div class="dist-cat-value highlight" style="color:#dc2626">${escapeHtml(getText(log.error))}</div>
      </div>
    </div>`;
  }

  // 查找上一条 POST 请求的 cache 值
  let prevCacheTokens = 0;
  if (window.currentLogs) {
    const currentIndex = window.currentLogs.findIndex(l => l.id === log.id);
    for (let i = currentIndex - 1; i >= 0; i--) {
      if (window.currentLogs[i].method === 'POST') {
        const prevUsage = window.currentLogs[i].response?.usage;
        prevCacheTokens = prevUsage?.cache_read_input_tokens || 0;
        break;
      }
    }
  }

  // 分析请求消息
  const messages = log.request?.messages || [];
  const userMsgs = messages.filter(m => m.role === 'user');
  const assistantMsgs = messages.filter(m => m.role === 'assistant');
  const systemMsgs = messages.filter(m => m.role === 'system');
  const requestSystem = log.request?.system;

  // 精确计算 token 数量（使用 gpt-tokenizer）
  const countTokens = (text) => {
    const t = getText(text);
    if (!t) return 0;
    try {
      return GPTTokenizer_cl100k_base.encode(t).length;
    } catch {
      return Math.ceil(t.length / 2);
    }
  };

  const systemTokens = systemMsgs.reduce((sum, m) => sum + countTokens(m.content), 0)
    + (requestSystem ? countTokens(requestSystem) : 0);
  const assistantTokens = assistantMsgs.reduce((sum, m) => sum + countTokens(m.content), 0);
  const userTokens = userMsgs.reduce((sum, m) => sum + countTokens(m.content), 0);
  const requestTotal = systemTokens + assistantTokens + userTokens;

  // 分析响应
  const sseStats = parseSseResponse(log.response);

  // 精确计算响应 token
  const thinkingTokens = countTokens(log.response?.thinking || '');
  const textTokens = countTokens(log.response?.assistantText || '');
  const responseTotal = thinkingTokens + textTokens;

  // 获取内容
  const lastUserContent = userMsgs.length > 0 ? getText(userMsgs[userMsgs.length - 1].content) : '';
  const responseText = sseStats?.textLen > 0 ? getText(log.response.assistantText) : '';
  const thinkingText = sseStats?.thinkingLen > 0 ? getText(log.response.thinking) : '';

  const modelName = log.response?.message?.model || log.request?.model || 'unknown';
  const maxContext = appContextLength;

  let html = '<div class="dist-bar-container">';

  const fmtPct = (v) => v.toFixed(2);
  const fmtTokens = (v) => v >= 1000 ? (v / 1000).toFixed(2) + 'k' : v.toString();
  const toPct = (v) => Math.round(v * 100) / 100;
  const pctOf = (tokens, base) => base > 0 ? toPct((tokens / base) * 100) : 0;

  const usage = sseStats?.usage || log.response?.usage;
  const hasUsage = usage?.input_tokens !== undefined;
  const cacheTokens = usage?.cache_read_input_tokens || 0;

  let totalInput;
  if (hasUsage) {
    totalInput = usage.input_tokens + cacheTokens;
  } else {
    totalInput = requestTotal;
  }
  const totalWithCache = totalInput + responseTotal;
  const barBase = maxContext || totalWithCache || 1;

  const totalK = (totalWithCache / 1000).toFixed(2);
  const totalSummary = maxContext
    ? `${totalK}k/${(maxContext / 1000).toFixed(0)}k tokens (${fmtPct(pctOf(totalWithCache, maxContext))}%)`
    : `${totalK}k tokens`;

  html += `<div class="dist-header">
    <div class="dist-model">${escapeHtml(modelName)}</div>
    <div class="dist-total">${totalSummary}</div>
  </div>`;

  const systemPct = toPct(Math.max(systemTokens > 0 ? 2 : 0, pctOf(systemTokens, barBase)));
  const assistantPct = toPct(Math.max(0, pctOf(assistantTokens, barBase)));
  const userPct = toPct(Math.max(0, pctOf(userTokens, barBase)));
  const thinkingPct = toPct(Math.max(0, pctOf(thinkingTokens, barBase)));
  const textPct = toPct(Math.max(0, pctOf(textTokens, barBase)));
  const usedPctSum = systemPct + assistantPct + userPct + thinkingPct + textPct;
  const freePct = maxContext ? toPct(Math.max(0, 100 - usedPctSum)) : 0;

  html += '<div class="dist-bar">';
  if (systemPct > 1) html += `<div class="dist-seg seg-system" style="width:${systemPct}%"></div>`;
  if (assistantPct > 1) html += `<div class="dist-seg seg-assistant" style="width:${assistantPct}%"></div>`;
  if (userPct > 1) html += `<div class="dist-seg seg-user" style="width:${userPct}%"></div>`;
  if (thinkingPct > 1) html += `<div class="dist-seg seg-thinking" style="width:${thinkingPct}%"></div>`;
  if (textPct > 1) html += `<div class="dist-seg seg-text" style="width:${textPct}%"></div>`;
  if (freePct > 1) html += `<div class="dist-seg seg-free" style="width:${freePct}%"></div>`;
  html += '</div>';

  // === 分类详情 ===
  html += '<div class="dist-categories">';

  // Messages 分组
  const showMessages = systemTokens > 0 || assistantTokens > 0 || userTokens > 0;
  if (showMessages) {
    html += '<div class="dist-cat-label" style="margin-bottom:8px;color:#666">Messages</div>';
  }

  // 进度条宽度：直接用百分比，最小 5%
  const barWidth = (pct) => Math.max(5, Math.min(100, pct));

  if (systemTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">System</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-system" style="width:${barWidth(systemPct)}%"></div></div>
      <div class="dist-cat-value">${fmtTokens(systemTokens)} (${fmtPct(systemPct)}%)</div>
    </div>`;
  }

  if (assistantTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">Assistant</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-assistant" style="width:${barWidth(assistantPct)}%"></div></div>
      <div class="dist-cat-value purple">${fmtTokens(assistantTokens)} (${fmtPct(assistantPct)}%)</div>
    </div>`;
  }

  if (userTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">User</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-user" style="width:${barWidth(userPct)}%"></div></div>
      <div class="dist-cat-value blue">${fmtTokens(userTokens)} (${fmtPct(userPct)}%)</div>
    </div>`;
  }

  // Cache 和 Input 显示（如果有 cache）
  if (cacheTokens > 0) {
    const actualInput = hasUsage ? usage.input_tokens : requestTotal;
    const totalInputWithCache = actualInput + cacheTokens;
    const cachePct = (cacheTokens / totalInputWithCache) * 100;
    const inputPct = (actualInput / totalInputWithCache) * 100;

    // 如果当前 cache 小于上一条，显示红色警告
    const cacheDecreased = prevCacheTokens > 0 && cacheTokens < prevCacheTokens;
    const cacheClass = cacheDecreased ? 'dist-cat-cache-warning' : 'dist-cat-cache';
    const cacheValueClass = cacheDecreased ? 'dist-cat-value cache-warning' : 'dist-cat-value cache';

    html += `<div class="dist-category ${cacheClass}">
      <div class="dist-cat-label">Cache</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-cache" style="width:${barWidth(cachePct)}%"></div></div>
      <div class="dist-cat-value cache">${fmtTokens(cacheTokens)} (${fmtPct(cachePct)}%)${cacheDecreased ? `<span style="color:#dc2626"> ↓${fmtTokens(prevCacheTokens - cacheTokens)}</span>` : ''}</div>
    </div>`;
    html += `<div class="dist-category">
      <div class="dist-cat-label">Input</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-user" style="width:${barWidth(inputPct)}%"></div></div>
      <div class="dist-cat-value blue">${fmtTokens(actualInput)} (${fmtPct(inputPct)}%)</div>
    </div>`;
  }

  // Output 分组
  const showOutput = thinkingTokens > 0 || textTokens > 0;
  if (showOutput) {
    html += '<div class="dist-cat-label" style="margin-top:12px;margin-bottom:8px;color:#666">Output</div>';
  }

  if (thinkingTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">Thinking</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-thinking" style="width:${Math.min(100, thinkingPct * 10)}%"></div></div>
      <div class="dist-cat-value purple">${fmtTokens(thinkingTokens)} (${fmtPct(thinkingPct)}%)</div>
    </div>`;
  }

  if (textTokens > 0) {
    html += `<div class="dist-category">
      <div class="dist-cat-label">Response</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-text" style="width:${Math.min(100, textPct * 10)}%"></div></div>
      <div class="dist-cat-value green">${fmtTokens(textTokens)} (${fmtPct(textPct)}%)</div>
    </div>`;
  }

  if (maxContext) {
    const freeTokens = Math.max(0, maxContext - totalWithCache);
    const freePctActual = pctOf(freeTokens, maxContext);
    html += '<div class="dist-cat-label" style="margin-top:12px;margin-bottom:8px;color:#666">Available</div>';
    html += `<div class="dist-category">
      <div class="dist-cat-label">Free</div>
      <div class="dist-cat-bar"><div class="dist-cat-fill seg-free" style="width:${Math.min(100, freePctActual)}%"></div></div>
      <div class="dist-cat-value">${fmtTokens(freeTokens)} (${fmtPct(freePctActual)}%)</div>
    </div>`;
  }

  html += '</div>';

  // === 实际内容展示 ===
  if (lastUserContent) {
    html += `<div class="dist-categories" style="margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a">
      <div class="dist-category" style="flex-direction:column;align-items:flex-start">
        <div class="dist-cat-label" style="color:#2563eb">User 最后输入</div>
        <div class="message-content" style="font-size:13px;color:#e0e0e0;width:100%;white-space:pre-wrap">${escapeHtml(lastUserContent)}</div>
      </div>`;
    if (thinkingText) {
      html += `<div class="dist-category" style="flex-direction:column;align-items:flex-start;margin-top:8px">
        <div class="dist-cat-label" style="color:#7c3aed">Thinking</div>
        <div class="message-content" style="font-size:13px;color:#e0e0e0;width:100%;white-space:pre-wrap">${escapeHtml(thinkingText)}</div>
      </div>`;
    }
    if (responseText) {
      html += `<div class="dist-category" style="flex-direction:column;align-items:flex-start;margin-top:8px">
        <div class="dist-cat-label" style="color:#059669">Response</div>
        <div class="message-content" style="font-size:13px;color:#e0e0e0;width:100%;white-space:pre-wrap">${escapeHtml(responseText)}</div>
      </div>`;
    }

    html += '</div>';
  }

  // === 本轮工具调用（只显示 response 里的新调用） ===
  const recentToolCalls = [];

  // 只从 response 提取本轮 tool_use
  if (log.response?.toolCalls && log.response.toolCalls.length > 0) {
    recentToolCalls.push(...log.response.toolCalls);
  }

  if (recentToolCalls.length > 0) {
    html += `<div class="dist-category" style="flex-direction:column;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a">
      <div class="dist-cat-label" style="color:#e89d3a;margin-bottom:8px">Tool Calls</div>`;
    // 倒序显示（最新的先显示）
    for (const tc of recentToolCalls.reverse()) {
      const inputStr = typeof tc.input === 'object' ? JSON.stringify(tc.input) : String(tc.input ?? '');
      const inputPreview = inputStr.length > 300 ? inputStr.slice(0, 300) + '…' : inputStr;
      html += `<div class="message-content" style="font-size:12px;color:#e0e0e0;width:100%;white-space:pre-wrap;margin-top:4px"><span style="color:#e89d3a">${escapeHtml(tc.name)}</span>: ${escapeHtml(inputPreview)}</div>`;
    }
    html += '</div>';
  }

  // === 耗时信息（单行） ===
  const metaParts = [`<span class="dist-cat-label">耗时</span><span class="dist-cat-value orange">${log.duration ?? '-'}ms</span>`];

  // SSE帧数
  if (sseStats?.frameCount > 0) {
    metaParts.push(`<span class="dist-meta-sep">·</span><span class="dist-cat-label">SSE帧数</span><span class="dist-cat-value">${sseStats.frameCount}</span>`);
  }

  // 消息长度
  const msgCount = messages.length;
  if (msgCount > 0) {
    metaParts.push(`<span class="dist-meta-sep">·</span><span class="dist-cat-label">消息长度</span><span class="dist-cat-value">${msgCount}</span>`);
  }

  // 工具调用次数（统计 messages 中 assistant 的 tool_use）
  let toolCallCount = 0;
  messages.forEach(m => {
    if (m.role === 'assistant' && Array.isArray(m.content)) {
      toolCallCount += m.content.filter(b => b.type === 'tool_use').length;
    }
  });
  if (toolCallCount > 0) {
    metaParts.push(`<span class="dist-meta-sep">·</span><span class="dist-cat-label">工具调用</span><span class="dist-cat-value">${toolCallCount}</span>`);
  }

  // Token速率 (token/s)
  const outTokens = usage?.output_tokens || 0;
  const durationSec = (log.duration || 0) / 1000;
  if (outTokens > 0 && durationSec > 0) {
    const rate = Math.round(outTokens / durationSec);
    metaParts.push(`<span class="dist-meta-sep">·</span><span class="dist-cat-label">Token速率</span><span class="dist-cat-value green">${rate} token/s</span>`);
  }

  html += `<div class="dist-categories" style="margin-top:12px;padding-top:8px;border-top:1px solid #2a2a2a">
    <div class="dist-meta-line">${metaParts.join('')}</div>
  </div>`;

  html += '</div>';
  return html;
}

// 渲染 content：字符串或 content block 数组
function renderRequestContent(content) {
  if (!content) return '<div class="message-content">(空)</div>';
  if (typeof content === 'string') {
    return `<div class="message-content">${escapeHtml(content)}</div>`;
  }
  if (!Array.isArray(content)) {
    return `<div class="message-content">${escapeHtml(getText(content))}</div>`;
  }
  return content.map((block, index) => {
    const type = block.type || 'block';
    const text = block.text ?? block.thinking ?? block.input ?? block.content ?? '';
    const preview = typeof text === 'string' ? text : getText(text);
    return `<div class="message-block" style="margin-bottom:6px">
      <div class="message-role"><span>${escapeHtml(type)}</span></div>
      <div class="message-content">${escapeHtml(preview)}</div>
    </div>`;
  }).join('');
}

function renderFriendlyRequest(request) {
  if (!request) return '';
  let html = '<div class="friendly-section"><div class="friendly-title">请求详情</div>';

  if (request.model) {
    html += `<div class="friendly-row"><div class="friendly-label">模型</div><div class="friendly-value blue">${escapeHtml(request.model)}</div></div>`;
  }

  const scalarFields = [
    ['max_tokens', '最大 Token'],
    ['temperature', '温度'],
    ['stream', '流式'],
    ['tool_choice', '工具选择'],
  ];
  for (const [key, label] of scalarFields) {
    if (request[key] !== undefined && request[key] !== null) {
      const display = typeof request[key] === 'object' ? JSON.stringify(request[key]) : String(request[key]);
      html += `<div class="friendly-row"><div class="friendly-label">${label}</div><div class="friendly-value">${escapeHtml(display)}</div></div>`;
    }
  }

  if (request.tools && request.tools.length > 0) {
    const toolNames = request.tools.map((tool) => tool.name || tool.type || '?').join(', ');
    html += `<div class="friendly-row"><div class="friendly-label">工具</div><div class="friendly-value">${request.tools.length} 个 · ${escapeHtml(toolNames)}</div></div>`;
  }

  // 不显示 system
  // if (request.system !== undefined && request.system !== null) { ... }

  if (request.messages && request.messages.length > 0) {
    html += `<div class="friendly-row"><div class="friendly-label">消息数</div><div class="friendly-value">${request.messages.length} 条</div></div>`;
    const reversedMsgs = [...request.messages].reverse();
    reversedMsgs.forEach((msg, idx) => {
      const role = msg.role || 'unknown';
      const actualIdx = request.messages.length - idx;
      html += `<div class="message-block">
        <div class="message-role"><span>${escapeHtml(role)}</span><span style="float:right;color:#555">#${actualIdx}</span></div>
        ${renderRequestContent(msg.content)}
      </div>`;
    });
  }

  html += '</div>';
  return html;
}

function renderFriendlyResponse(response) {
  if (!response) return '';
  let html = '<div class="friendly-section"><div class="friendly-title">响应详情</div>';

  const sseStats = parseSseResponse(response);

  if (sseStats && response.format === 'sse') {
    // SSE 格式响应
    html += `<div class="friendly-row"><div class="friendly-label">格式</div><div class="friendly-value">SSE 流式</div></div>`;
    html += `<div class="friendly-row"><div class="friendly-label">帧数</div><div class="friendly-value">${sseStats.frameCount}</div></div>`;

    if (response.message) {
      html += `<div class="friendly-row"><div class="friendly-label">消息ID</div><div class="friendly-value">${response.message.id || '-'}</div></div>`;
      if (response.message.model) {
        html += `<div class="friendly-row"><div class="friendly-label">实际模型</div><div class="friendly-value blue">${response.message.model}</div></div>`;
      }
    }

    if (sseStats.thinkingLen > 0) {
      const thinking = getText(response.thinking);
      html += `<div class="thinking-block">
        <div class="thinking-label">思考过程 (${thinking.length} 字)</div>
        <div class="message-content">${escapeHtml(thinking)}</div>
      </div>`;
    }

    if (sseStats.textLen > 0) {
      const text = getText(response.assistantText);
      html += `<div class="response-block">
        <div class="response-label">回复内容 (${text.length} 字)</div>
        <div class="message-content">${escapeHtml(text)}</div>
      </div>`;
    }

    if (response.stopReason) {
      html += `<div class="friendly-row"><div class="friendly-label">停止原因</div><div class="friendly-value orange">${response.stopReason}</div></div>`;
    }

    if (sseStats.usage) {
      const u = sseStats.usage;
      const parts = [];
      if (u.input_tokens !== undefined) parts.push(`输入: ${u.input_tokens}`);
      if (u.output_tokens !== undefined) parts.push(`输出: ${u.output_tokens}`);
      if (u.cache_read_input_tokens !== undefined) parts.push(`缓存: ${u.cache_read_input_tokens}`);
      if (u.cache_creation_input_tokens !== undefined) parts.push(`缓存创建: ${u.cache_creation_input_tokens}`);
      html += `<div class="friendly-row"><div class="friendly-label">Token 使用</div><div class="friendly-value highlight" style="word-break:break-all">${parts.join(' · ')}</div></div>`;
    }

  } else if (response.choices) {
    // OpenAI 格式
    html += `<div class="friendly-row"><div class="friendly-label">格式</div><div class="friendly-value">OpenAI</div></div>`;
    for (const choice of response.choices) {
      const content = getText(choice.message?.content || choice.delta?.content);
      html += `<div class="response-block">
        <div class="response-label">回复</div>
        <div class="message-content">${escapeHtml(content)}</div>
      </div>`;
    }

  } else if (response.content) {
    // Anthropic 格式
    html += `<div class="friendly-row"><div class="friendly-label">格式</div><div class="friendly-value">Anthropic</div></div>`;
    for (const block of response.content) {
      if (block.type === 'text') {
        html += `<div class="response-block">
          <div class="response-label">文本回复</div>
          <div class="message-content">${escapeHtml(getText(block.text))}</div>
        </div>`;
      } else if (block.type === 'thinking') {
        html += `<div class="thinking-block">
          <div class="thinking-label">思考过程</div>
          <div class="message-content">${escapeHtml(getText(block.thinking))}</div>
        </div>`;
      }
    }

  } else if (response.models) {
    // 模型列表
    html += `<div class="friendly-row"><div class="friendly-label">格式</div><div class="friendly-value">模型列表</div></div>`;
    html += `<div class="friendly-row"><div class="friendly-label">模型数</div><div class="friendly-value highlight">${response.models.length}</div></div>`;
    const modelNames = response.models.map(m => m.name || m.id || m).join(', ');
    html += `<div class="friendly-row"><div class="friendly-label">模型</div><div class="friendly-value">${escapeHtml(modelNames)}</div></div>`;

  } else {
    // 其他格式 - 显示关键字段
    const keys = Object.keys(response).slice(0, 5);
    for (const key of keys) {
      const val = response[key];
      const display = typeof val === 'object' ? JSON.stringify(val) : String(val);
      html += `<div class="friendly-row"><div class="friendly-label">${key}</div><div class="friendly-value">${escapeHtml(display)}</div></div>`;
    }
  }

  html += '</div>';
  return html;
}

function renderDetailContent(log) {
  const mode = viewModes[log.id] || 'friendly';
  let html = '';

  // 视图切换按钮 + 复制按钮（原始数据时显示）
  html += `<div class="view-toggle" style="justify-content:space-between">
    <div style="display:flex;gap:8px">
      <button class="view-btn ${mode === 'friendly' ? 'active' : ''}" onclick="toggleViewMode(${log.id}, 'friendly'); event.stopPropagation();">友好视图</button>
      <button class="view-btn ${mode === 'raw' ? 'active' : ''}" onclick="toggleViewMode(${log.id}, 'raw'); event.stopPropagation();">原始数据</button>
    </div>
    ${mode === 'raw' ? `<button class="btn" onclick="copyRawData(${log.id})" style="padding:4px 10px;font-size:12px">拷贝数据</button>` : ''}
  </div>`;

  if (log.error) {
    html += `<div class="detail-error">${log.error}</div>`;
  }

  if (mode === 'friendly') {
    // 好友视图 - 响应在前，请求在后（倒序）
    html += `<div class="friendly-view">`;
    html += renderFriendlyResponse(log.response);

    // === 工具调用统计（所有历史） ===
    const toolCallStats = {};
    const request = log.request;
    if (request && request.messages && Array.isArray(request.messages)) {
      request.messages.forEach(m => {
        if (m.role === 'assistant' && Array.isArray(m.content)) {
          m.content.forEach(block => {
            if (block.type === 'tool_use') {
              const name = block.name || 'unknown';
              toolCallStats[name] = (toolCallStats[name] || 0) + 1;
            }
          });
        }
      });
    }
    // 也统计 response 里的 toolCalls
    if (log.response?.toolCalls && log.response.toolCalls.length > 0) {
      log.response.toolCalls.forEach(tc => {
        const name = tc.name || 'unknown';
        toolCallStats[name] = (toolCallStats[name] || 0) + 1;
      });
    }

    const toolNames = Object.keys(toolCallStats);
    if (toolNames.length > 0) {
      const totalCount = toolNames.reduce((sum, name) => sum + toolCallStats[name], 0);
      const statsStr = toolNames.map(name => `${name} x${toolCallStats[name]}`).join(', ');
      html += `<div class="friendly-section"><div class="friendly-title">工具调用统计</div>`;
      html += `<div class="friendly-row"><div class="friendly-label">总次数</div><div class="friendly-value orange">${totalCount}</div></div>`;
      html += `<div class="friendly-row"><div class="friendly-label">分布</div><div class="friendly-value">${escapeHtml(statsStr)}</div></div>`;
      html += '</div>';
    }

    html += renderFriendlyRequest(log.request);
    html += `</div>`;
  } else {
    // 原始数据视图 - 响应在前，请求在后（倒序）
    if (log.response) {
      html += `<div class="detail-section">
        <div class="detail-label">响应</div>
        <div class="detail-json">${escapeHtml(JSON.stringify(log.response, null, 2))}</div>
      </div>`;
    }
    if (log.request) {
      html += `<div class="detail-section">
        <div class="detail-label">请求</div>
        <div class="detail-json request-json">${escapeHtml(JSON.stringify(log.request, null, 2))}</div>
      </div>`;
    }
  }

  return html;
}

// 复制原始数据（完整拷贝，不做加工）
function copyRawData(logId) {
  const log = window.currentLogs?.find(l => l.id === logId);
  if (!log) return;
  const text = JSON.stringify(log, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    // 简单提示
    const btn = document.querySelector('.panel-body .btn');
    if (btn) {
      const original = btn.textContent;
      btn.textContent = '已复制!';
      btn.style.color = '#059669';
      setTimeout(() => {
        btn.textContent = original;
        btn.style.color = '';
      }, 1500);
    }
  }).catch(err => {
    alert('复制失败: ' + err);
  });
}

// 渲染单个日志卡片
function renderSingleLogCard(log) {
  const statusClass = log.status >= 200 && log.status < 300 ? 'success' : 'error';

  let html = `<div class="log-card" data-log-id="${log.id}">`;

  // 头部信息

    <div class="log-time">${splitTime(log.time)}</div>
    <div class="log-method ${log.method}">${log.method}</div>

function renderLogs(logs) {
  window.currentLogs = logs; // 保存用于切换视图时查找
  const container = document.getElementById('logContainer');

  if (!logs || logs.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-text">等待请求...</div>
      </div>
    `;
    return;
  }

  const reversed = [...logs].reverse();
  let html = '';

  for (const log of reversed) {
    const statusClass = log.status >= 200 && log.status < 300 ? 'success' : 'error';

    html += `<div class="log-card" data-log-id="${log.id}">`;

    // 头部信息
    html += `<div class="log-header">
      <div class="log-time">${splitTime(log.time)}</div>
      <div class="log-method ${log.method}">${log.method}</div>
      <div class="log-path">${log.path}</div>
      <div><span class="log-status ${statusClass}">${log.status || (log.error ? 'ERR' : '-')}</span></div>
      <button class="log-expand-btn" onclick="toggleDetail(${log.id}); event.stopPropagation();">详情</button>
    </div>`;

    // 横向分布条占位（POST 请求延迟渲染）
    if (log.method === 'POST') {
      html += `<div class="dist-bar-wrap dist-bar-placeholder" data-log-id="${log.id}"><div class="dist-header"><div class="dist-model">加载中...</div></div></div>`;
    }

    html += `</div>`;
  }

  container.innerHTML = html;

  // 逐个异步渲染分布条，避免首次加载卡顿
  renderDistBarsProgressively(logs, container);
}

// 异步逐个渲染分布条
function renderDistBarsProgressively(logs, container) {
  const placeholders = container.querySelectorAll('.dist-bar-placeholder');
  const items = [];

  placeholders.forEach(el => {
    const logId = parseInt(el.dataset.logId);
    const log = logs.find(l => l.id === logId);
    if (log) {
      items.push({ el, log });
    }
  });

  if (items.length === 0) return;

  let index = 0;
  function renderNext() {
    if (index >= items.length) return;
    const { el, log } = items[index];
    try {
      el.outerHTML = `<div class="dist-bar-wrap">${buildDistBar(log)}</div>`;
    } catch (e) {
      console.error('buildDistBar error:', e);
    }
    index++;
    if (index < items.length) {
      // 使用 requestIdleCallback 或 setTimeout 间隔渲染
      if (typeof requestIdleCallback !== 'undefined') {
        requestIdleCallback(() => renderNext(), { timeout: 50 });
      } else {
        setTimeout(renderNext, 30);
      }
    }
  }

  // 首个延迟一点渲染，让页面先稳定
  setTimeout(renderNext, 100);
}

function toggleDetail(logId) {
  const log = window.currentLogs?.find(l => l.id === logId);
  if (!log) return;

  expandedLogId = logId; // 设置当前展开的日志 ID

  document.getElementById('panelOverlay').classList.add('open');

function closePanel() {
  document.body.classList.remove('panel-open');
  document.getElementById('slidePanel').classList.remove('open');
  document.getElementById('panelOverlay').classList.remove('open');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Diff 对比功能
let currentDiffLogId = null;

// 提取差异行
function extractDiffLines() {
  if (!expandedLogId) return;
  currentDiffLogId = expandedLogId;

  const currentLog = window.currentLogs?.find(l => l.id === currentDiffLogId);
  if (!currentLog) return;

  // 找上一条 POST 请求
  const logs = window.currentLogs || [];
  const currentIndex = logs.findIndex(l => l.id === currentDiffLogId);
  let prevLog = null;

  for (let i = currentIndex - 1; i >= 0; i--) {
    if (logs[i].method === 'POST') {
      prevLog = logs[i];
      break;
    }
  }

  if (!prevLog) {
    alert('没有可对比的更早 POST 请求');
    return;
  }

  const currentMsgs = currentLog.request?.messages || [];
  const prevMsgs = prevLog.request?.messages || [];

  // 提取差异行
  const diffs = [];
  const maxLen = Math.max(currentMsgs.length, prevMsgs.length);

  for (let i = 0; i < maxLen; i++) {
    const curr = currentMsgs[i];
    const prev = prevMsgs[i];

    const currContent = curr ? getText(curr.content) : '';
    const prevContent = prev ? getText(prev.content) : '';

    if (currContent !== prevContent) {
      diffs.push({
        index: i + 1,
        last: prev ? prevContent : null,
        new: curr ? currContent : null
      });
    }
  }

  if (diffs.length === 0) {
    alert('没有发现差异');
    return;
  }

  // 构建输出格式
  let output = '';
  for (const d of diffs) {
    output += `## last (#${d.index})\n`;
    output += '```json\n';
    if (d.last) {
      output += d.last + '\n';
    }
    output += '```\n';
    output += `## new (#${d.index})\n`;
    output += '```json\n';
    if (d.new) {
      output += d.new + '\n';
    }
    output += '```\n';
    output += '---\n';
  }

  // 复制到剪贴板
  navigator.clipboard.writeText(output).then(() => {
    alert(`已复制 ${diffs.length} 条差异到剪贴板`);
  }).catch(() => {
    console.log(output);
    alert('差异内容已打印到控制台');
  });
}

function openDiffView() {
  if (!expandedLogId) return;
  currentDiffLogId = expandedLogId;

  const currentLog = window.currentLogs?.find(l => l.id === currentDiffLogId);
  if (!currentLog) return;

  // 找上一条 POST 请求（时间上更早的）
  const logs = window.currentLogs || [];
  const currentIndex = logs.findIndex(l => l.id === currentDiffLogId);
  let prevLog = null;

  // 往前找（索引减小方向），找到时间上更早的 POST 请求
  for (let i = currentIndex - 1; i >= 0; i--) {
    if (logs[i].method === 'POST') {
      prevLog = logs[i];
      break;
    }
  }

  if (!prevLog) {
    alert('没有可对比的更早 POST 请求');
    return;
  }

  // 关闭详情面板
  closePanel();

  // 打开 diff 视图
  document.getElementById('diffContainer').classList.add('open');
  document.getElementById('diffTitleLeft').textContent = `上一条 #${prevLog.id}`;
  document.getElementById('diffTitleRight').textContent = `当前 #${currentLog.id}`;

  // 渲染对比
  renderDiffMessages(
    currentLog.request?.messages || [],
    prevLog.request?.messages || []
  );
}

function closeDiffView() {
  document.getElementById('diffContainer').classList.remove('open');
  currentDiffLogId = null;
}

// Token 级别 LCS diff
function tokenizeText(text) {
  if (!text) return [];
  try {
    const tokens = GPTTokenizer_cl100k_base.encode(text);
    return tokens.map(t => {
      const decoded = GPTTokenizer_cl100k_base.decode([t]);
      return { id: t, text: decoded };
    });
  } catch {
    // fallback: 按字符分割
    return text.split('').map((c, i) => ({ id: i, text: c }));
  }
}

// LCS diff 算法，返回差异标记
function lcsDiff(tokensA, tokensB) {
  const m = tokensA.length;
  const n = tokensB.length;

  // LCS 表
  const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (tokensA[i - 1].id === tokensB[j - 1].id) {
        dp[i][j] = dp[i - 1][j - 1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
  }

  // 回溯找出差异
  const resultA = [];
  const resultB = [];
  let i = m, j = n;

  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && tokensA[i - 1].id === tokensB[j - 1].id) {
      resultA.unshift({ ...tokensA[i - 1], status: 'same' });
      resultB.unshift({ ...tokensB[j - 1], status: 'same' });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      resultB.unshift({ ...tokensB[j - 1], status: 'added' });
      j--;
    } else if (i > 0) {
      resultA.unshift({ ...tokensA[i - 1], status: 'removed' });
      i--;
    }
  }

  return { tokensA: resultA, tokensB: resultB };
}

// 渲染 token diff 内容
function renderTokenDiffContent(tokens) {
  if (!tokens || tokens.length === 0) return '';

  let html = '';
  let buffer = '';
  let currentStatus = null;

  for (const token of tokens) {
    if (token.status !== currentStatus) {
      if (buffer) {
        const cls = currentStatus === 'same' ? 'diff-token-same' :
                    currentStatus === 'added' ? 'diff-token-added' :
                    currentStatus === 'removed' ? 'diff-token-removed' : 'diff-token-diff';
        html += `<span class="diff-token ${cls}">${escapeHtml(buffer)}</span>`;
      }
      buffer = token.text;
      currentStatus = token.status;
    } else {
      buffer += token.text;
    }
  }

  // 输出最后的 buffer
  if (buffer) {
    const cls = currentStatus === 'same' ? 'diff-token-same' :
                currentStatus === 'added' ? 'diff-token-added' :
                currentStatus === 'removed' ? 'diff-token-removed' : 'diff-token-diff';
    html += `<span class="diff-token ${cls}">${escapeHtml(buffer)}</span>`;
  }

  return html;
}

function renderDiffMessages(currentMsgs, prevMsgs) {
  const leftPanel = document.getElementById('diffPanelLeft');
  const rightPanel = document.getElementById('diffPanelRight');
  const minimapItems = document.getElementById('diffMinimapItems');

  const maxLen = Math.max(currentMsgs.length, prevMsgs.length);
  let leftHtml = '';
  let rightHtml = '';
  let minimapHtml = '';

  // Token 计算
  const countTokens = (text) => {
    const t = getText(text);
    if (!t) return 0;
    try {
      return GPTTokenizer_cl100k_base.encode(t).length;
    } catch {
      return Math.ceil(t.length / 2);
    }
  };

  // 每个消息占 minimap 的百分比高度
  const heightPerMsg = 100 / maxLen;

  for (let i = 0; i < maxLen; i++) {
    const curr = currentMsgs[i];
    const prev = prevMsgs[i];

    const currTokens = curr ? countTokens(curr.content) : 0;
    const prevTokens = prev ? countTokens(prev.content) : 0;
    const tokenDiff = currTokens - prevTokens;

    let status = 'same';

    if (!prev && curr) {
      status = 'added';
    } else if (prev && !curr) {
      status = 'removed';
    } else if (JSON.stringify(curr) !== JSON.stringify(prev)) {
      status = 'diff';
    } else if (tokenDiff !== 0) {
      status = 'diff';
    }

    // 索引从 1 开始
    const displayIndex = i + 1;

    // minimap 百分比位置：topPct = i / maxLen * 100, heightPct = 100 / maxLen
    const topPct = (i / maxLen) * 100;
    const heightPct = heightPerMsg;

    // Token diff 计算（只在有差异时）
    let tokenDiffResult = null;
    if (status === 'diff' && curr && prev) {
      const currContent = getText(curr.content);
      const prevContent = getText(prev.content);
      const tokensA = tokenizeText(prevContent);
      const tokensB = tokenizeText(currContent);
      tokenDiffResult = lcsDiff(tokensA, tokensB);
    }

    leftHtml += renderDiffMessage(prev, displayIndex, prevTokens, status === 'removed' ? 'removed' : status === 'diff' ? 'diff' : 'same', 0, tokenDiffResult?.tokensA);
    rightHtml += renderDiffMessage(curr, displayIndex, currTokens, status === 'added' ? 'added' : status === 'diff' ? 'diff' : 'same', tokenDiff, tokenDiffResult?.tokensB);
    minimapHtml += renderMinimapItem(displayIndex, status, topPct, heightPct);
  }

  leftPanel.innerHTML = leftHtml || '<div style="color:#666;padding:20px">无消息</div>';
  rightPanel.innerHTML = rightHtml || '<div style="color:#666;padding:20px">无消息</div>';
  minimapItems.innerHTML = minimapHtml || '<div style="color:#666;padding:8px;font-size:11px">无差异</div>';

  // 初始化滚动和 minimap
  initDiffScroll();
}

function renderMinimapItem(index, status, topPct, heightPct) {
  const statusClass = status === 'same' ? 'diff-minimap-same' :
                      status === 'added' ? 'diff-minimap-added' :
                      status === 'removed' ? 'diff-minimap-removed' : 'diff-minimap-diff';

  return `<div class="diff-minimap-item ${statusClass}" style="top:${topPct}%;height:${heightPct}%" data-index="${index}" onclick="scrollToDiffMessage(${index})"></div>`;
}

function renderDiffMessage(msg, index, tokens, status, tokenDiff = 0, tokenDiffTokens = null) {
  const statusClass = status === 'same' ? 'diff-same' :
                      status === 'added' ? 'diff-added' :
                      status === 'removed' ? 'diff-removed' : 'diff-diff';

  if (!msg) {
    return `<div class="diff-message ${statusClass}" style="opacity:0.3" data-index="${index}">
      <div class="diff-message-header">
        <div class="diff-message-index">#${index}</div>
      </div>
      <div class="diff-message-content" style="color:#555">—</div>
    </div>`;
  }

  const role = msg.role || 'unknown';
  const content = getText(msg.content);
  const tokenInfo = tokenDiff !== 0 ? `<span style="color:#d97706;font-size:11px"> (${tokenDiff > 0 ? '+' : ''}${tokenDiff})</span>` : '';

  // 使用 token diff 渲染，或者普通渲染
  const contentHtml = tokenDiffTokens ? renderTokenDiffContent(tokenDiffTokens) : escapeHtml(content);

  return `<div class="diff-message ${statusClass}" data-index="${index}">
    <div class="diff-message-header">
      <div class="diff-message-role">${role}</div>
      <div class="diff-message-index">#${index} · ${tokens}t${tokenInfo}</div>
    </div>
    <div class="diff-message-content">${contentHtml}</div>
  </div>`;
}

function scrollToDiffMessage(index) {
  const leftPanel = document.getElementById('diffPanelLeft');
  const rightPanel = document.getElementById('diffPanelRight');

  // 找到对应的消息元素
  const leftMsg = leftPanel.querySelector(`[data-index="${index}"]`);
  const rightMsg = rightPanel.querySelector(`[data-index="${index}"]`);

  if (leftMsg || rightMsg) {
    // 计算滚动位置（消息顶部对齐）
    const targetTop = (leftMsg?.offsetTop || rightMsg?.offsetTop || 0) - 20;

    // 同时滚动两个面板
    leftPanel.scrollTop = targetTop;
    rightPanel.scrollTop = targetTop;

    // 更新 minimap 视口位置（基于消息索引，与 minimap item 均匀布局匹配）
    const minimapItems = document.getElementById('diffMinimapItems');
    const viewport = document.getElementById('diffMinimapViewport');
    const messages = leftPanel.querySelectorAll('.diff-message');
    const totalMsgs = messages.length;

    // viewport 位置对应当前消息在 minimap 中的位置
    const msgIdx = index - 1; // index 从 1 开始
    const topPct = (msgIdx / totalMsgs) * 100;

    viewport.style.top = (8 + (topPct / 100) * (minimapItems.clientHeight - viewport.clientHeight)) + 'px';
  }
}

function initDiffScroll() {
  const leftPanel = document.getElementById('diffPanelLeft');
  const rightPanel = document.getElementById('diffPanelRight');
  const minimap = document.getElementById('diffMinimap');
  const viewport = document.getElementById('diffMinimapViewport');
  const minimapItems = document.getElementById('diffMinimapItems');
  const diffContainer = document.getElementById('diffContainer');

  let isDragging = false;

  // 更新视口位置和面板滚动
  function updateByRatio(ratio) {
    const maxScroll = Math.max(
      leftPanel.scrollHeight - leftPanel.clientHeight,
      rightPanel.scrollHeight - rightPanel.clientHeight
    );

    const scrollTop = ratio * maxScroll;
    leftPanel.scrollTop = scrollTop;
    rightPanel.scrollTop = scrollTop;

    // 更新视口指示器
    const minimapHeight = minimapItems.clientHeight;
    const viewportHeight = Math.max(16, (leftPanel.clientHeight / Math.max(leftPanel.scrollHeight, rightPanel.scrollHeight)) * minimapHeight);
    const viewportTop = 8 + ratio * (minimapHeight - viewportHeight);

    viewport.style.height = viewportHeight + 'px';
    viewport.style.top = viewportTop + 'px';
  }

  // minimap 拖动
  minimap.addEventListener('mousedown', (e) => {
    isDragging = true;
    handleMinimapDrag(e);
    e.preventDefault();
    e.stopPropagation();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    handleMinimapDrag(e);
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // minimap 滚轮事件 - 控制对比列表滚动
  minimap.addEventListener('wheel', (e) => {
    const maxScroll = Math.max(
      leftPanel.scrollHeight - leftPanel.clientHeight,
      rightPanel.scrollHeight - rightPanel.clientHeight
    );
    const currentRatio = leftPanel.scrollTop / maxScroll;
    const delta = e.deltaY > 0 ? 0.01 : -0.01;
    const newRatio = Math.max(0, Math.min(1, currentRatio + delta));
    updateByRatio(newRatio);
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  // diff 面板滚轮事件
  const panelWheelHandler = (e) => {
    const maxScroll = Math.max(
      leftPanel.scrollHeight - leftPanel.clientHeight,
      rightPanel.scrollHeight - rightPanel.clientHeight
    );
    const currentRatio = leftPanel.scrollTop / maxScroll;
    const delta = e.deltaY > 0 ? 0.01 : -0.01;
    const newRatio = Math.max(0, Math.min(1, currentRatio + delta));
    updateByRatio(newRatio);
    e.preventDefault();
    e.stopPropagation();
  };

  leftPanel.addEventListener('wheel', panelWheelHandler, { passive: false });
  rightPanel.addEventListener('wheel', panelWheelHandler, { passive: false });

  function handleMinimapDrag(e) {
    const minimapRect = minimap.getBoundingClientRect();
    const yRatio = Math.max(0, Math.min(1, (e.clientY - minimapRect.top - 8) / (minimapRect.height - 16)));
    updateByRatio(yRatio);
  }

  // 点击 minimap 条目跳转
  minimapItems.addEventListener('click', (e) => {
    const item = e.target.closest('.diff-minimap-item');
    if (!item) return;
    const index = parseInt(item.dataset.index);
    scrollToDiffMessage(index);
  });

  // 初始化
  updateByRatio(0);
}
</script>
