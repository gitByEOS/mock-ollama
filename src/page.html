function normalizedLogUsage(log) {
  const usage = log.response?.usage;
  if (!usage || typeof usage !== 'object') return null;
  const rawInput = Number(usage.input_tokens ?? usage.prompt_tokens);
  const output = Number(usage.output_tokens ?? usage.completion_tokens ?? 0);
  const cacheRead = Number(usage.cache_read_input_tokens ?? usage.cache_read_tokens
    ?? usage.input_tokens_details?.cached_tokens ?? usage.prompt_tokens_details?.cached_tokens ?? 0);
  const cacheCreation = Number(usage.cache_creation_input_tokens ?? usage.cache_creation_tokens ?? 0);
  if (![rawInput, output, cacheRead, cacheCreation].every(Number.isFinite)) return null;
  const separatedCache = Object.hasOwn(usage, 'cache_read_input_tokens')
    || Object.hasOwn(usage, 'cache_creation_input_tokens')
    || Object.hasOwn(usage, 'cache_read_tokens')
    || Object.hasOwn(usage, 'cache_creation_tokens');
  const input = rawInput + (separatedCache ? cacheRead + cacheCreation : 0);
  return { input, output, cacheRead, total: input + output };
}

const LOG_INTERACTION_PREVIEW_MAX = 2000;
const MAX_LOG_CONTENT_BLOCKS = 16;

function appendLogPreview(current, value, maxLength) {
  if (typeof value !== 'string' || value.length === 0 || current.length >= maxLength) return current;
  const separator = current ? '\n' : '';
  const available = maxLength - current.length - separator.length;
  if (available <= 0) return current;
  return `${current}${separator}${value.length > available ? `${value.slice(0, Math.max(0, available - 1))}…` : value}`;
}

function previewTextContent(content, maxLength = LOG_INTERACTION_PREVIEW_MAX) {
  if (typeof content === 'string') return appendLogPreview('', content, maxLength);
  if (!Array.isArray(content)) return '';
  let text = '';
  for (let index = 0; index < Math.min(content.length, MAX_LOG_CONTENT_BLOCKS); index++) {
    const block = content[index];
    if (typeof block === 'string') {
      text = appendLogPreview(text, block, maxLength);
      continue;
    }
    if (!block || typeof block !== 'object') continue;
    const type = block.type;
    if (type === 'tool_result' || type === 'tool_use_result' || type === 'tool_use' || type === 'function_call' || type === 'function_call_output') continue;
    text = appendLogPreview(text, typeof block.text === 'string' ? block.text : '', maxLength);
  }
  return text;
}

function previewToolResultContent(content) {
  if (!Array.isArray(content)) return '';
  let text = '';
  for (let index = 0; index < Math.min(content.length, MAX_LOG_CONTENT_BLOCKS); index++) {
    const block = content[index];
    if (!block || typeof block !== 'object') continue;
    if (block.type !== 'tool_result' && block.type !== 'tool_use_result' && block.type !== 'function_call_output') continue;
    const result = typeof block.content === 'string' ? block.content : block.output;
    if (typeof result === 'string') text = appendLogPreview(text, result, LOG_INTERACTION_PREVIEW_MAX);
    else if (Array.isArray(result)) text = appendLogPreview(text, previewTextContent(result), LOG_INTERACTION_PREVIEW_MAX);
  }
  return text;
}

function requestInteractionSummary(log) {
  const empty = { label: '', color: '', content: '' };
  const request = log.request;
  if (!request || typeof request !== 'object') return empty;
  const items = Array.isArray(request.messages) ? request.messages : Array.isArray(request.input) ? request.input : null;
  if (!items) return typeof request.input === 'string'
    ? { label: 'User 输入', color: '#2563eb', content: appendLogPreview('', request.input, LOG_INTERACTION_PREVIEW_MAX) }
    : empty;
  for (let index = items.length - 1; index >= 0; index--) {
    const item = items[index];
    if (!item || typeof item !== 'object' || item.role === 'system') continue;
    if (item.role === 'tool' || item.type === 'function_call_output') {
      const content = previewTextContent(item.content ?? item.output);
      if (content) return { label: '工具结果', color: '#d97706', content };
    }
    if (item.role === 'user') {
      const toolResult = previewToolResultContent(item.content);
      if (toolResult) return { label: '工具结果', color: '#d97706', content: toolResult };
      const content = previewTextContent(item.content);
      if (content) return { label: 'User 输入', color: '#2563eb', content };
    }
    if (item.role === 'assistant' || item.type === 'function_call') {
      const content = previewTextContent(item.content);
      if (content) return { label: 'Assistant 上下文', color: '#a78bfa', content };
    }
  }
  return empty;
}

function responseOutput(log) {
  const response = log.response;
  if (!response || typeof response !== 'object') return typeof response === 'string' ? appendLogPreview('', response, LOG_INTERACTION_PREVIEW_MAX) : '';
  if (typeof response.assistantText === 'string') return appendLogPreview('', response.assistantText, LOG_INTERACTION_PREVIEW_MAX);
  if (response.message?.content) return previewTextContent(response.message.content);
  if (response.choices?.[0]?.message?.content) return previewTextContent(response.choices[0].message.content);
  if (Array.isArray(response.content)) return previewTextContent(response.content);
  if (Array.isArray(response.output)) {
    let text = '';
    for (let index = 0; index < Math.min(response.output.length, MAX_LOG_CONTENT_BLOCKS); index++) {
      text = appendLogPreview(text, previewTextContent(response.output[index]?.content), LOG_INTERACTION_PREVIEW_MAX);
    }
    if (text) return text;
  }
  return typeof response.response === 'string' ? appendLogPreview('', response.response, LOG_INTERACTION_PREVIEW_MAX) : '';
}

function renderLogInteraction(log) {
  const request = requestInteractionSummary(log);
  const output = responseOutput(log);
  const thinking = typeof log.response?.thinking === 'string' ? appendLogPreview('', log.response.thinking, LOG_INTERACTION_PREVIEW_MAX) : '';
  const item = (label, color, content) => content ? `<div class="dist-category" style="flex-direction:column;align-items:flex-start;margin-top:8px"><div class="dist-cat-label" style="color:${color}">${label}</div><div class="message-content log-interaction-content">${escapeHtml(content)}</div></div>` : '';
  if (!request.content && !thinking && !output) return '';
  return `<div class="dist-categories" style="margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a">
    ${item(request.label, request.color, request.content)}
    ${item('Thinking', '#7c3aed', thinking)}
    ${item('Response', '#059669', output)}
  </div>`;
}

// Diff 对比功能
let currentDiffLogId = null;

// 提取差异行
function extractDiffLines() {
  if (!expandedLogId) return;
  currentDiffLogId = expandedLogId;

  const currentLog = window.currentLogs?.find(l => l.id === currentDiffLogId);
  if (!currentLog) return;

  const prevLog = findPreviousSessionPost(currentLog);
  if (!prevLog) {
    alert('没有同一会话的更早 POST 请求');
    return;
  }

  const currentMsgs = currentLog.request?.messages || [];
  const prevMsgs = prevLog.request?.messages || [];

  // 提取差异行
  const diffs = [];
  const maxLen = Math.max(currentMsgs.length, prevMsgs.length);

  for (let i = 0; i < maxLen; i++) {
    const curr = currentMsgs[i];
    const prev = prevMsgs[i];

    const currContent = curr ? getText(curr.content) : '';
    const prevContent = prev ? getText(prev.content) : '';

    if (currContent !== prevContent) {
      diffs.push({
        index: i + 1,
        last: prev ? prevContent : null,
        new: curr ? currContent : null
      });
    }
  }

  if (diffs.length === 0) {
    alert('没有发现差异');
    return;
  }

  // 构建输出格式
  let output = '';
  for (const d of diffs) {
    output += `## last (#${d.index})\n`;
    output += '```json\n';
    if (d.last) {
      output += d.last + '\n';
    }
    output += '```\n';
    output += `## new (#${d.index})\n`;
    output += '```json\n';
    if (d.new) {
      output += d.new + '\n';
    }
    output += '```\n';
    output += '---\n';
  }

  // 复制到剪贴板
  navigator.clipboard.writeText(output).then(() => {
    alert(`已复制 ${diffs.length} 条差异到剪贴板`);
  }).catch(() => {
    console.log(output);
    alert('差异内容已打印到控制台');
  });
}

function openDiffView() {
  if (!expandedLogId) return;
  currentDiffLogId = expandedLogId;

  const currentLog = window.currentLogs?.find(l => l.id === currentDiffLogId);
  if (!currentLog) return;

  const prevLog = findPreviousSessionPost(currentLog);
  if (!prevLog) {
    alert('没有同一会话的更早 POST 请求');

  document.getElementById('diffTitleRight').textContent = `当前 #${currentLog.id}`;

  // 渲染对比
  renderDiffMessages(
    currentLog.request?.messages || [],
    prevLog.request?.messages || []
  );
}

function closeDiffView() {

}

// Token 级别 LCS diff
function tokenizeText(text) {
  if (!text) return [];
  try {
    const tokens = GPTTokenizer_cl100k_base.encode(text);
    return tokens.map(t => {
      const decoded = GPTTokenizer_cl100k_base.decode([t]);
      return { id: t, text: decoded };
    });
  } catch {
    // fallback: 按字符分割
    return text.split('').map((c, i) => ({ id: i, text: c }));
  }
}

const MAX_LCS_TOKENS_PER_SIDE = 2000;
const MAX_LCS_MATRIX_CELLS = 2000000;

function quickTokenDiff(tokensA, tokensB) {
  let prefix = 0;
  while (prefix < tokensA.length && prefix < tokensB.length && tokensA[prefix].id === tokensB[prefix].id) prefix++;
  let suffix = 0;
  while (suffix < tokensA.length - prefix && suffix < tokensB.length - prefix
      && tokensA[tokensA.length - 1 - suffix].id === tokensB[tokensB.length - 1 - suffix].id) suffix++;
  const mark = (tokens, changedStatus) => tokens.map((token, index) => ({
    ...token,
    status: index < prefix || index >= tokens.length - suffix ? 'same' : changedStatus,
  }));
  return { tokensA: mark(tokensA, 'removed'), tokensB: mark(tokensB, 'added'), degraded: true };
}

// 有界 LCS；超限时保留公共前后缀并降级，禁止制造无界主线程任务。
function lcsDiff(tokensA, tokensB) {
  const m = tokensA.length;
  const n = tokensB.length;
  if (m > MAX_LCS_TOKENS_PER_SIDE || n > MAX_LCS_TOKENS_PER_SIDE || m * n > MAX_LCS_MATRIX_CELLS) {
    return quickTokenDiff(tokensA, tokensB);
  }
  const dp = Array.from({ length: m + 1 }, () => new Uint32Array(n + 1));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = tokensA[i - 1].id === tokensB[j - 1].id
        ? dp[i - 1][j - 1] + 1
        : Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }
  const resultA = [];
  const resultB = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && tokensA[i - 1].id === tokensB[j - 1].id) {
      resultA.unshift({ ...tokensA[i - 1], status: 'same' });
      resultB.unshift({ ...tokensB[j - 1], status: 'same' });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      resultB.unshift({ ...tokensB[j - 1], status: 'added' });
      j--;
    } else {
      resultA.unshift({ ...tokensA[i - 1], status: 'removed' });
      i--;
    }
  }
  return { tokensA: resultA, tokensB: resultB, degraded: false };
}

// 渲染 token diff 内容
function renderTokenDiffContent(tokens) {
  if (!tokens || tokens.length === 0) return '';

  let html = '';
  let buffer = '';
  let currentStatus = null;

  for (const token of tokens) {
    if (token.status !== currentStatus) {
      if (buffer) {
        const cls = currentStatus === 'same' ? 'diff-token-same' :
                    currentStatus === 'added' ? 'diff-token-added' :
                    currentStatus === 'removed' ? 'diff-token-removed' : 'diff-token-diff';
        html += `<span class="diff-token ${cls}">${escapeHtml(buffer)}</span>`;
      }
      buffer = token.text;
      currentStatus = token.status;
    } else {
      buffer += token.text;
    }
  }

  // 输出最后的 buffer
  if (buffer) {
    const cls = currentStatus === 'same' ? 'diff-token-same' :
                currentStatus === 'added' ? 'diff-token-added' :
                currentStatus === 'removed' ? 'diff-token-removed' : 'diff-token-diff';
    html += `<span class="diff-token ${cls}">${escapeHtml(buffer)}</span>`;
  }

  return html;
}

function renderDiffMessages(currentMsgs, prevMsgs) {
  const leftPanel = document.getElementById('diffPanelLeft');
  const rightPanel = document.getElementById('diffPanelRight');
  const minimapItems = document.getElementById('diffMinimapItems');

  const maxLen = Math.max(currentMsgs.length, prevMsgs.length);
  let leftHtml = '';
  let rightHtml = '';
  let minimapHtml = '';

  // Token 计算
  const countTokens = (text) => {
    const t = getText(text);
    if (!t) return 0;
    try {
      return GPTTokenizer_cl100k_base.encode(t).length;
    } catch {
      return Math.ceil(t.length / 2);
    }
  };

  // 每个消息占 minimap 的百分比高度
  const heightPerMsg = maxLen > 0 ? 100 / maxLen : 100;
  window.currentDiffDegraded = false;

  for (let i = 0; i < maxLen; i++) {
    const curr = currentMsgs[i];
    const prev = prevMsgs[i];

    const currTokens = curr ? countTokens(curr.content) : 0;
    const prevTokens = prev ? countTokens(prev.content) : 0;
    const tokenDiff = currTokens - prevTokens;

    let status = 'same';

    if (!prev && curr) {
      status = 'added';
    } else if (prev && !curr) {
      status = 'removed';
    } else if (JSON.stringify(curr) !== JSON.stringify(prev)) {
      status = 'diff';
    } else if (tokenDiff !== 0) {
      status = 'diff';
    }

    // 索引从 1 开始
    const displayIndex = i + 1;

    // minimap 百分比位置：topPct = i / maxLen * 100, heightPct = 100 / maxLen
    const topPct = (i / maxLen) * 100;
    const heightPct = heightPerMsg;

    // Token diff 计算（只在有差异时）
    let tokenDiffResult = null;
    if (status === 'diff' && curr && prev) {
      const currContent = getText(curr.content);
      const prevContent = getText(prev.content);
      const tokensA = tokenizeText(prevContent);
      const tokensB = tokenizeText(currContent);
      tokenDiffResult = lcsDiff(tokensA, tokensB);
      if (tokenDiffResult.degraded) window.currentDiffDegraded = true;
    }

    leftHtml += renderDiffMessage(prev, displayIndex, prevTokens, status === 'removed' ? 'removed' : status === 'diff' ? 'diff' : 'same', 0, tokenDiffResult?.tokensA);
    rightHtml += renderDiffMessage(curr, displayIndex, currTokens, status === 'added' ? 'added' : status === 'diff' ? 'diff' : 'same', tokenDiff, tokenDiffResult?.tokensB);
    minimapHtml += renderMinimapItem(displayIndex, status, topPct, heightPct);
  }

  const degradedNotice = window.currentDiffDegraded ? '<div class="token-chart-error" style="height:auto">内容过大，已使用快速对比</div>' : '';
  leftPanel.innerHTML = degradedNotice + (leftHtml || '<div style="color:#666;padding:20px">无消息</div>');
  rightPanel.innerHTML = degradedNotice + (rightHtml || '<div style="color:#666;padding:20px">无消息</div>');
  minimapItems.innerHTML = minimapHtml || '<div style="color:#666;padding:8px;font-size:11px">无差异</div>';

  // 初始化滚动和 minimap
  initDiffScroll();
}

function renderMinimapItem(index, status, topPct, heightPct) {
  const statusClass = status === 'same' ? 'diff-minimap-same' :
                      status === 'added' ? 'diff-minimap-added' :
                      status === 'removed' ? 'diff-minimap-removed' : 'diff-minimap-diff';

  return `<div class="diff-minimap-item ${statusClass}" style="top:${topPct}%;height:${heightPct}%" data-index="${index}" onclick="scrollToDiffMessage(${index})"></div>`;
}

function renderDiffMessage(msg, index, tokens, status, tokenDiff = 0, tokenDiffTokens = null) {
  const statusClass = status === 'same' ? 'diff-same' :
                      status === 'added' ? 'diff-added' :
                      status === 'removed' ? 'diff-removed' : 'diff-diff';

  if (!msg) {
    return `<div class="diff-message ${statusClass}" style="opacity:0.3" data-index="${index}">
      <div class="diff-message-header">
        <div class="diff-message-index">#${index}</div>
      </div>
      <div class="diff-message-content" style="color:#555">—</div>
    </div>`;
  }

  const role = msg.role || 'unknown';
  const content = getText(msg.content);
  const tokenInfo = tokenDiff !== 0 ? `<span style="color:#d97706;font-size:11px"> (${tokenDiff > 0 ? '+' : ''}${tokenDiff})</span>` : '';

  // 使用 token diff 渲染，或者普通渲染
  const contentHtml = tokenDiffTokens ? renderTokenDiffContent(tokenDiffTokens) : escapeHtml(content);

  return `<div class="diff-message ${statusClass}" data-index="${index}">
    <div class="diff-message-header">
      <div class="diff-message-role">${role}</div>
      <div class="diff-message-index">#${index} · ${tokens}t${tokenInfo}</div>
    </div>
    <div class="diff-message-content">${contentHtml}</div>
  </div>`;
}

function scrollToDiffMessage(index) {
  const leftPanel = document.getElementById('diffPanelLeft');
  const rightPanel = document.getElementById('diffPanelRight');

  // 找到对应的消息元素
  const leftMsg = leftPanel.querySelector(`[data-index="${index}"]`);
  const rightMsg = rightPanel.querySelector(`[data-index="${index}"]`);

  if (leftMsg || rightMsg) {
    // 计算滚动位置（消息顶部对齐）
    const targetTop = (leftMsg?.offsetTop || rightMsg?.offsetTop || 0) - 20;

    // 同时滚动两个面板
    leftPanel.scrollTop = targetTop;
    rightPanel.scrollTop = targetTop;

    // 更新 minimap 视口位置（基于消息索引，与 minimap item 均匀布局匹配）
    const minimapItems = document.getElementById('diffMinimapItems');
    const viewport = document.getElementById('diffMinimapViewport');
    const messages = leftPanel.querySelectorAll('.diff-message');
    const totalMsgs = messages.length;

    // viewport 位置对应当前消息在 minimap 中的位置
    const msgIdx = index - 1; // index 从 1 开始
    const topPct = (msgIdx / totalMsgs) * 100;

    viewport.style.top = (8 + (topPct / 100) * (minimapItems.clientHeight - viewport.clientHeight)) + 'px';
  }
}

function initDiffScroll() {
  const leftPanel = document.getElementById('diffPanelLeft');
  const rightPanel = document.getElementById('diffPanelRight');
  const minimap = document.getElementById('diffMinimap');
  const viewport = document.getElementById('diffMinimapViewport');
  const minimapItems = document.getElementById('diffMinimapItems');
  const diffContainer = document.getElementById('diffContainer');

  let isDragging = false;
  let currentRatio = 0;
  let pendingRatio = null;
  let scrollFrame = null;
  let minimapRect = null;
  const maxHeight = Math.max(leftPanel.scrollHeight, rightPanel.scrollHeight);
  const metrics = {
    maxScroll: Math.max(leftPanel.scrollHeight - leftPanel.clientHeight, rightPanel.scrollHeight - rightPanel.clientHeight),
    minimapHeight: minimapItems.clientHeight,
    viewportHeight: Math.max(16, (leftPanel.clientHeight / maxHeight) * minimapItems.clientHeight),
  };

  function flushDiffScroll() {
    scrollFrame = null;
    if (pendingRatio === null) return;
    currentRatio = pendingRatio;
    pendingRatio = null;
    const scrollTop = currentRatio * metrics.maxScroll;
    leftPanel.scrollTop = scrollTop;
    rightPanel.scrollTop = scrollTop;
    viewport.style.height = metrics.viewportHeight + 'px';
    viewport.style.top = (8 + currentRatio * (metrics.minimapHeight - metrics.viewportHeight)) + 'px';
  }

  // 高频 wheel/drag 事件只记录目标比例，每个动画帧统一写一次布局。
  function updateByRatio(ratio) {
    pendingRatio = Math.max(0, Math.min(1, ratio));
    if (scrollFrame === null) scrollFrame = requestAnimationFrame(flushDiffScroll);
  }

  // minimap 拖动
  minimap.addEventListener('mousedown', (e) => {
    isDragging = true;
    minimapRect = minimap.getBoundingClientRect();
    handleMinimapDrag(e);
    e.preventDefault();
    e.stopPropagation();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    handleMinimapDrag(e);
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
    minimapRect = null;
  });

  // minimap 滚轮事件 - 控制对比列表滚动
  minimap.addEventListener('wheel', (e) => {
    const delta = e.deltaY > 0 ? 0.01 : -0.01;
    updateByRatio((pendingRatio ?? currentRatio) + delta);
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  // diff 面板滚轮事件
  const panelWheelHandler = (e) => {
    const delta = e.deltaY > 0 ? 0.01 : -0.01;
    updateByRatio((pendingRatio ?? currentRatio) + delta);
    e.preventDefault();
    e.stopPropagation();
  };

  leftPanel.addEventListener('wheel', panelWheelHandler, { passive: false });
  rightPanel.addEventListener('wheel', panelWheelHandler, { passive: false });

  function handleMinimapDrag(e) {
    minimapRect ??= minimap.getBoundingClientRect();
    const yRatio = Math.max(0, Math.min(1, (e.clientY - minimapRect.top - 8) / (minimapRect.height - 16)));
    updateByRatio(yRatio);
  }

  // 点击 minimap 条目跳转
  minimapItems.addEventListener('click', (e) => {
    const item = e.target.closest('.diff-minimap-item');
    if (!item) return;
    const index = parseInt(item.dataset.index);
    scrollToDiffMessage(index);
  });

  // 初始化
  updateByRatio(0);
}
</script>
